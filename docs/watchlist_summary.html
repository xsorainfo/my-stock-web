<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>™️ Watchlist总结</title>
    
    <!-- ⭐ 路径需要回到上一级 -->
    <link rel="stylesheet" href="../components/navbar.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        body {
            background-color: #f4f6f9;
            color: #1e293b;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .summary-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 24px;
        }
        
        .summary-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 48px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        
        .markdown-body {
            font-size: 15px;
            color: #1e293b;
        }
        
        .markdown-body h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }
        
        .markdown-body h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 32px;
            margin-bottom: 16px;
            padding-left: 12px;
            border-left: 4px solid #2563eb;
        }
        
        .markdown-body h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-top: 24px;
            margin-bottom: 12px;
        }
        
        .markdown-body p {
            margin-bottom: 12px;
            color: #475569;
        }
        
        .markdown-body ul {
            padding-left: 24px;
            margin-bottom: 16px;
        }
        
        .markdown-body li {
            margin-bottom: 4px;
            color: #475569;
        }
        
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0 24px 0;
            font-size: 13px;
        }
        
        .markdown-body table th {
            background: #f1f5f9;
            color: #0f172a;
            font-weight: 600;
            padding: 10px 12px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }
        
        .markdown-body table td {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            color: #475569;
        }
        
        .markdown-body table tr:nth-child(even) {
            background: #f8fafc;
        }
        
        .markdown-body blockquote {
            border-left: 4px solid #2563eb;
            padding: 8px 16px;
            margin: 16px 0;
            background: #eff6ff;
            border-radius: 0 8px 8px 0;
            color: #1e40af;
        }
        
        .markdown-body code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #2563eb;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }
        
        .markdown-body pre {
            background: #1e293b;
            padding: 20px 24px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 16px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid #334155;
        }
        
        .markdown-body pre code {
            background: transparent;
            color: #e2e8f0;
            padding: 0;
            font-size: 13px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .markdown-body hr {
            border: none;
            border-top: 2px solid #e2e8f0;
            margin: 32px 0;
        }
        
        .markdown-body strong {
            color: #0f172a;
            font-weight: 700;
        }
        
        .loading {
            text-align: center;
            padding: 60px 0;
            color: #94a3b8;
        }
        
        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            text-align: center;
            padding: 60px 0;
            color: #ef4444;
        }
        
        .error .emoji {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .error button {
            margin-top: 16px;
            padding: 8px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .error button:hover {
            background: #1d4ed8;
        }
        
        @media (max-width: 768px) {
            .summary-card {
                padding: 24px 16px;
            }
            .markdown-body {
                font-size: 14px;
            }
            .markdown-body h1 {
                font-size: 22px;
            }
            .markdown-body table {
                font-size: 11px;
            }
            .markdown-body table th,
            .markdown-body table td {
                padding: 6px 8px;
            }
        }
        
        @media (max-width: 480px) {
            .summary-container {
                padding: 0 12px;
                margin: 16px auto;
            }
            .summary-card {
                padding: 16px 12px;
            }
            .markdown-body table {
                font-size: 10px;
            }
            .markdown-body table th,
            .markdown-body table td {
                padding: 4px 6px;
            }
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="summary-container">
        <div class="summary-card">
            <div id="markdown-content">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>📄 正在加载标的总结...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- ⭐ 路径回到上一级 -->
    <script src="../components/navbar.js"></script>
    
    <script>
        async function loadSummary() {
            const container = document.getElementById('markdown-content');
            
            try {
                // ⭐ 同目录下的 .md 文件
                const response = await fetch('WATCHLIST_SUMMARY.md?v=' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error('文件加载失败 (HTTP ' + response.status + ')');
                }
                
                const markdownText = await response.text();
                const htmlContent = marked.parse(markdownText);
                
                container.innerHTML = `
                    <div class="markdown-body">
                        ${htmlContent}
                    </div>
                `;
                
            } catch (error) {
                console.error('加载失败:', error);
                container.innerHTML = `
                    <div class="error">
                        <div class="emoji">⚠️</div>
                        <h2>加载失败</h2>
                        <p>${error.message}</p>
                        <p style="margin-top: 8px; font-size: 13px; color: #94a3b8;">
                            请确认 WATCHLIST_SUMMARY.md 文件存在
                        </p>
                        <button onclick="location.reload()">🔄 重新加载</button>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadSummary);
    </script>

</body>
</html>
