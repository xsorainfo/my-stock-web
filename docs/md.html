<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档中心 - 全球AI硬科技决策终端</title>
    
    <link rel="stylesheet" href="../components/navbar.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        
        body {
            background-color: #f4f6f9;
            color: #1e293b;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .summary-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 24px;
        }
        
        .summary-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 48px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        
        .markdown-body {
            font-size: 15px;
            color: #1e293b;
        }
        
        .markdown-body h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 12px;
            margin-bottom: 24px;
        }
        
        .markdown-body h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 32px;
            margin-bottom: 16px;
            padding-left: 12px;
            border-left: 4px solid #2563eb;
        }
        
        .markdown-body h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin-top: 24px;
            margin-bottom: 12px;
        }
        
        .markdown-body h4 {
            font-size: 15px;
            font-weight: 600;
            color: #334155;
            margin-top: 16px;
            margin-bottom: 8px;
        }
        
        .markdown-body p {
            margin-bottom: 12px;
            color: #475569;
        }
        
        .markdown-body ul {
            padding-left: 20px;
            margin-bottom: 12px;
            list-style-type: disc;
        }
        
        .markdown-body ul ul {
            padding-left: 24px;
            list-style-type: circle;
        }
        
        .markdown-body ul ul ul {
            padding-left: 24px;
            list-style-type: square;
        }
        
        .markdown-body ol {
            padding-left: 20px;
            margin-bottom: 12px;
        }
        
        .markdown-body li {
            margin-bottom: 2px;
            color: #475569;
            line-height: 1.7;
        }
        
        .markdown-body li strong {
            color: #0f172a;
        }
        
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0 24px 0;
            font-size: 13px;
        }
        
        .markdown-body table th {
            background: #f1f5f9;
            color: #0f172a;
            font-weight: 600;
            padding: 10px 12px;
            text-align: left;
            border: 1px solid #e2e8f0;
        }
        
        .markdown-body table td {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            color: #475569;
        }
        
        .markdown-body table tr:nth-child(even) {
            background: #f8fafc;
        }
        
        .markdown-body table tr:hover {
            background: #f1f5f9;
        }
        
        .markdown-body blockquote {
            border-left: 4px solid #2563eb;
            padding: 8px 16px;
            margin: 16px 0;
            background: #eff6ff;
            border-radius: 0 8px 8px 0;
            color: #1e40af;
        }
        
        .markdown-body code {
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            color: #2563eb;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        }
        
        .markdown-body pre {
            background: #1e293b;
            padding: 20px 24px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 16px 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 1px solid #334155;
        }
        
        .markdown-body pre code {
            background: transparent;
            color: #e2e8f0;
            padding: 0;
            font-size: 13px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .markdown-body hr {
            border: none;
            border-top: 2px solid #e2e8f0;
            margin: 32px 0;
        }
        
        .markdown-body strong {
            color: #0f172a;
            font-weight: 700;
        }
        
        .loading {
            text-align: center;
            padding: 60px 0;
            color: #94a3b8;
        }
        
        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            text-align: center;
            padding: 60px 0;
            color: #ef4444;
        }
        
        .error .emoji {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .error button {
            margin-top: 16px;
            padding: 8px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        .error button:hover {
            background: #1d4ed8;
        }
        
        .doc-title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }
        
        .doc-title-bar h1 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
        }
        
        .doc-title-bar .back-link {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }
        
        .doc-title-bar .back-link:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 768px) {
            .summary-card {
                padding: 24px 16px;
            }
            .markdown-body {
                font-size: 14px;
            }
            .markdown-body h1 {
                font-size: 22px;
            }
            .markdown-body h2 {
                font-size: 18px;
            }
            .markdown-body table {
                font-size: 11px;
            }
            .markdown-body table th,
            .markdown-body table td {
                padding: 6px 8px;
            }
            .markdown-body pre {
                padding: 12px 16px;
                font-size: 12px;
            }
            .doc-title-bar h1 {
                font-size: 18px;
            }
        }
        
        @media (max-width: 480px) {
            .summary-container {
                padding: 0 12px;
                margin: 16px auto;
            }
            .summary-card {
                padding: 16px 12px;
            }
            .markdown-body table {
                font-size: 10px;
            }
            .markdown-body table th,
            .markdown-body table td {
                padding: 4px 6px;
            }
            .markdown-body pre {
                padding: 8px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="summary-container">
        <div class="summary-card">
            <div class="doc-title-bar">
                <h1 id="docTitle">📄 文档中心</h1>
                <a href="javascript:history.back()" class="back-link">← 返回</a>
            </div>
            <div id="markdown-content">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>📄 正在加载文档...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="../components/navbar.js"></script>
    
    <script>
        // ============================================================
        // 文件名 → 显示名称 映射
        // ============================================================
        const DOC_TITLES = {
            'WATCHLIST_SUMMARY': '📊 标的总结',
            'SEMICONDUCTOR_INDUSTRY': '🏭 半导体产业链全景',
            // ⭐ 新增文档在这里添加
            // 'ANOTHER_DOC': '📌 另一个文档标题',
        };

        // ============================================================
        // 从 URL 获取文件名参数
        // ============================================================
        function getDocNameFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('file');
        }

        // ============================================================
        // 加载并渲染 Markdown
        // ============================================================
        async function loadDoc() {
            const container = document.getElementById('markdown-content');
            const titleEl = document.getElementById('docTitle');
            
            const docName = getDocNameFromURL();
            
            if (!docName) {
                container.innerHTML = `
                    <div class="error">
                        <div class="emoji">❓</div>
                        <h2>未指定文档</h2>
                        <p>请在 URL 中添加 ?file=文档名称 参数</p>
                        <p style="font-size: 13px; color: #94a3b8; margin-top: 8px;">
                            例如: viewer.html?file=WATCHLIST_SUMMARY
                        </p>
                    </div>
                `;
                return;
            }
            
            // 更新标题
            const displayName = DOC_TITLES[docName] || `📄 ${docName}`;
            titleEl.textContent = displayName;
            
            try {
                // 尝试加载 .md 文件
                const response = await fetch(`${docName}.md?v=${new Date().getTime()}`);
                
                if (!response.ok) {
                    throw new Error(`文件 ${docName}.md 不存在 (HTTP ${response.status})`);
                }
                
                const markdownText = await response.text();
                
                const htmlContent = marked.parse(markdownText, {
                    gfm: true,
                    breaks: true,
                    pedantic: false,
                    smartLists: true
                });
                
                container.innerHTML = `
                    <div class="markdown-body">
                        ${htmlContent}
                    </div>
                `;
                
            } catch (error) {
                console.error('加载失败:', error);
                container.innerHTML = `
                    <div class="error">
                        <div class="emoji">⚠️</div>
                        <h2>加载失败</h2>
                        <p>${error.message}</p>
                        <p style="margin-top: 8px; font-size: 13px; color: #94a3b8;">
                            请确认 docs/${docName}.md 文件存在
                        </p>
                        <button onclick="location.reload()">🔄 重新加载</button>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', loadDoc);
    </script>

</body>
</html>
