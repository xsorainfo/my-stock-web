<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 ポートフォリオ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
    
    <!-- ⭐ 共通样式 -->
    <link rel="stylesheet" href="../components/common.css">
    <!-- ⭐ 导航栏样式 -->
    <link rel="stylesheet" href="../components/navbar.css">
    
    <style>
        /* ============================================================
           portfolio.html 特有样式
           ============================================================ */
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 8px;
        }
        
        /* ===== 切换标签 ===== */
        .portfolio-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }
        
        .portfolio-tabs .tab-btn {
            padding: 8px 20px;
            border: 2px solid transparent;
            border-radius: 8px;
            background: #f1f5f9;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        .portfolio-tabs .tab-btn:hover {
            background: #e2e8f0;
            color: #1e293b;
            transform: translateY(-1px);
        }
        
        .portfolio-tabs .tab-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .portfolio-tabs .tab-btn .count {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.7;
            margin-left: 4px;
        }
        
        .portfolio-tabs .tab-btn.active .count {
            opacity: 0.9;
        }
        
        /* ===== 表示モード切替ボタン ===== */
        .view-mode-toggle {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-left: auto;
        }
        
        .view-mode-toggle .mode-btn {
            padding: 4px 14px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #64748b;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        .view-mode-toggle .mode-btn:hover {
            color: #1e293b;
        }
        
        .view-mode-toggle .mode-btn.active {
            background: #ffffff;
            color: #2563eb;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }
        
        /* ===== ヘッダー ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .page-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }
        
        .page-header .subtitle {
            font-size: 13px;
            color: #94a3b8;
        }
        
        .page-header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        /* ===== 空状态 ===== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #94a3b8;
        }
        
        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .empty-state p {
            font-size: 16px;
        }
        
        /* ===== Sector（一级） ===== */
        .sector-section {
            margin-bottom: 40px;
        }

        .sector-title {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 8px;
            border-left: 4px solid #2563eb;
            color: #ffffff;
        }

        .sector-comment {
            font-family: 'Zen Maru Gothic', 'Hiragino Sans', 'Noto Sans SC', sans-serif;
            font-size: 13px;
            color: #00035b;
            margin: -6px 0 18px 16px;
            padding: 6px 0;
            background: transparent;
            border-bottom: 2px dashed #e2e8f0;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }

        /* ===== Industry（二级） ===== */
        .industry-section {
            margin-bottom: 28px;
            margin-left: 16px;
        }

        .industry-title {
            font-size: 17px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
            padding: 6px 14px;
            background: #f8fafc;
            border-radius: 4px;
            border-left: 3px solid #2563eb;
        }

        .industry-comment {
            font-family: 'Zen Maru Gothic', 'Hiragino Sans', 'Noto Sans SC', sans-serif;
            font-size: 13px;
            color: #00035b;
            margin: -4px 0 14px 28px;
            padding: 4px 0;
            background: transparent;
            border-bottom: 1.5px dashed #eaeef5;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }
        
        /* ===== レスポンシブ ===== */
        @media (max-width: 768px) {
            .portfolio-tabs {
                padding: 8px 12px;
                gap: 6px;
            }
            .portfolio-tabs .tab-btn {
                padding: 6px 14px;
                font-size: 12px;
            }
            .page-header h2 {
                font-size: 17px;
            }
            .view-mode-toggle .mode-btn {
                font-size: 11px;
                padding: 3px 10px;
            }
        }
        
        @media (max-width: 480px) {
            .portfolio-tabs .tab-btn {
                padding: 4px 10px;
                font-size: 11px;
            }
            .view-mode-toggle .mode-btn {
                font-size: 10px;
                padding: 2px 8px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏占位符 -->
    <div id="navbar-placeholder"></div>
    
    <div class="container">
        <!-- ===== ポートフォリオ切り替えタブ ===== -->
        <div class="portfolio-tabs" id="portfolioTabs">
            <!-- JavaScript で生成 -->
        </div>
        
        <!-- ===== ヘッダー ===== -->
        <div class="page-header">
            <div>
                <h2 id="pageTitle">📊 ポートフォリオ</h2>
            </div>
            <div class="page-header-right">
                <span class="subtitle" id="stockCount"></span>
                <!-- ⭐ 表示モード切替ボタン -->
                <div class="view-mode-toggle" id="viewModeToggle">
                    <button class="mode-btn active" data-mode="group" onclick="setViewMode('group')">
                        📂 グループ
                    </button>
                    <button class="mode-btn" data-mode="flat" onclick="setViewMode('flat')">
                        📋 フラット
                    </button>
                </div>
            </div>
        </div>
        
        <!-- ===== 銘柄グリッド ===== -->
        <div id="stockGridContainer">
            <div class="empty-state">
                <div class="emoji">👈</div>
                <p>ポートフォリオを選択してください</p>
            </div>
        </div>
    </div>
    
    <!-- ⭐ Footer 占位符 -->
    <div id="footer-placeholder"></div>
    
    <!-- 引入脚本 -->
    <script src="../components/navbar.js"></script>
    <script src="../components/common.js"></script>
    <script src="../components/footer.js"></script>
    
    <script>
    // ============================================================
    // portfolio.html 特有逻辑
    // ============================================================

    // ============================================================
    // 1. ポートフォリオ定義（ビルトイン + 外部読み込み）
    // ============================================================
    let PORTFOLIO_LISTS = {};

    // デフォルトのポートフォリオ（バックアップ用）
    const DEFAULT_PORTFOLIO_LISTS = {
        "buffett": {
            "name": "バフェット",
            "icon": "🧔",
            "description": "Warren Buffett バークシャー・ハサウェイ",
            "symbols": ["AAPL", "BAC", "AXP", "KO", "CVX", "OXY", "KHC", "MCO", "TMO", "DVA"]
        },
        "blackrock": {
            "name": "ブラックロック",
            "icon": "🏛️",
            "description": "BlackRock 世界最大の資産運用会社",
            "symbols": ["AAPL", "MSFT", "NVDA", "AMZN", "META", "GOOGL", "BRK.B", "LLY", "VTI", "IVV"]
        },
        "vanguard": {
            "name": "バンガード",
            "icon": "📈",
            "description": "Vanguard 世界最大のインデックス運用会社",
            "symbols": ["AAPL", "MSFT", "AMZN", "NVDA", "GOOGL", "META", "BRK.B", "JPM", "VTI", "BND"]
        },
        "softbank": {
            "name": "ソフトバンク",
            "icon": "🗼",
            "description": "SoftBank Group ビジョンファンド",
            "symbols": ["9984.T", "ARM", "NVDA", "TCEHY", "Uber", "CMCSA", "ALNY", "PACB"]
        },
        "ai_semiconductor": {
            "name": "AI半導体",
            "icon": "🧠",
            "description": "AI半導体関連（GPU・HBM・製造設備）",
            "symbols": ["NVDA", "AMD", "INTC", "TSM", "AVGO", "MU", "AMAT", "LRCX", "KLAC", "ASML"]
        },
        "ai_data_center": {
            "name": "AIデータセンター",
            "icon": "☁️",
            "description": "AIデータセンター・クラウド基盤",
            "symbols": ["AMZN", "MSFT", "GOOGL", "META", "ORCL", "SNOW", "CRWD", "PLTR", "DELL", "SMCI"]
        },
        "japan_semiconductor": {
            "name": "日本半導体",
            "icon": "🇯🇵",
            "description": "日本半導体・電子部品",
            "symbols": ["4062.T", "6857.T", "8035.T", "6762.T", "6981.T", "6954.T", "6506.T", "6324.T", "3110.T", "5803.T"]
        },
        "japan_robotics": {
            "name": "日本ロボット",
            "icon": "🤖",
            "description": "日本ロボット・FA関連",
            "symbols": ["6954.T", "6506.T", "6324.T", "6594.T", "6479.T", "6273.T", "6481.T", "6501.T", "6503.T", "6383.T"]
        },
        "japan_physical_ai": {
            "name": "日本フィジカルAI",
            "icon": "🏗️",
            "description": "日本フィジカルAI政策（10.5兆円）の重点銘柄",
            "symbols": ["6954.T", "6506.T", "6324.T", "6594.T", "6479.T", "6471.T", "6472.T", "6481.T", "6273.T", "6501.T", "6503.T", "6383.T", "7012.T"]
        },
        "physical_ai_global": {
            "name": "グローバル物理AI",
            "icon": "🌍",
            "description": "フィジカルAI グローバル主要プレイヤー",
            "symbols": ["NVDA", "TSLA", "MSFT", "GOOGL", "AMZN", "6954.T", "6506.T", "6324.T", "6594.T", "4062.T"]
        }
    };

    // ============================================================
    // 2. グローバルデータ
    // ============================================================
    let allStocks = [];
    let currentPortfolioId = null;
    let currentViewMode = 'group';  // 'group' または 'flat'

    // ============================================================
    // 3. ポートフォリオリスト読み込み
    // ============================================================
    async function loadPortfolioLists() {
        try {
            const response = await fetch('/data/data.json?v=' + new Date().getTime());
            if (response.ok) {
                const data = await response.json();
                if (data.portfolio_lists && Object.keys(data.portfolio_lists).length > 0) {
                    PORTFOLIO_LISTS = data.portfolio_lists;
                    console.log('📋 portfolio_lists を data.json から読み込みました');
                    return;
                }
            }
            
            const resp2 = await fetch('/data/portfolio_lists.json?v=' + new Date().getTime());
            if (resp2.ok) {
                const data = await resp2.json();
                if (data && Object.keys(data).length > 0) {
                    PORTFOLIO_LISTS = data;
                    console.log('📋 portfolio_lists を portfolio_lists.json から読み込みました');
                    return;
                }
            }
            
            console.warn('⚠️ portfolio_lists が見つかりません。デフォルトを使用します。');
            PORTFOLIO_LISTS = DEFAULT_PORTFOLIO_LISTS;
            
        } catch (error) {
            console.error('portfolio_lists の読み込みに失敗:', error);
            PORTFOLIO_LISTS = DEFAULT_PORTFOLIO_LISTS;
        }
    }

    // ============================================================
    // 4. レンダリング関数
    // ============================================================

    // タブをレンダリング
    function renderTabs() {
        const container = document.getElementById('portfolioTabs');
        if (!container) return;
        
        if (!PORTFOLIO_LISTS || Object.keys(PORTFOLIO_LISTS).length === 0) {
            PORTFOLIO_LISTS = DEFAULT_PORTFOLIO_LISTS;
        }
        
        let html = '';
        for (const [id, list] of Object.entries(PORTFOLIO_LISTS)) {
            const matched = getMatchedStocks(id);
            const count = matched.length;
            html += `
                <button class="tab-btn ${id === currentPortfolioId ? 'active' : ''}" 
                        data-portfolio-id="${id}"
                        onclick="switchPortfolio('${id}')">
                    ${list.icon || '📊'} ${list.name || id}
                    <span class="count">(${count})</span>
                </button>
            `;
        }
        container.innerHTML = html;
    }

    // ポートフォリオにマッチする銘柄を取得
    function getMatchedStocks(portfolioId) {
        const list = PORTFOLIO_LISTS[portfolioId];
        if (!list) return [];
        
        const symbols = list.symbols || [];
        if (symbols.length === 0) return [];
        
        return allStocks.filter(stock => {
            const stockSymbol = stock.code || '';
            return symbols.some(sym => {
                const cleanSym = String(sym).split('.')[0];
                const cleanStock = String(stockSymbol).split('.')[0];
                return cleanStock === cleanSym || stockSymbol === sym;
            });
        });
    }

    // ポートフォリオ切り替え
    function switchPortfolio(portfolioId) {
        currentPortfolioId = portfolioId;
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.portfolioId === portfolioId);
        });
        
        displayPortfolio(portfolioId);
    }

    // ============================================================
    // 5. 表示モード切替
    // ============================================================
    function setViewMode(mode) {
        currentViewMode = mode;
        
        // ボタンのアクティブ状態を更新
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        
        // 現在のポートフォリオを再表示
        if (currentPortfolioId) {
            displayPortfolio(currentPortfolioId);
        }
    }

    // ============================================================
    // 6. ポートフォリオ表示
    // ============================================================
    function displayPortfolio(portfolioId) {
        const container = document.getElementById('stockGridContainer');
        const countEl = document.getElementById('stockCount');
        const titleEl = document.getElementById('pageTitle');
        
        const list = PORTFOLIO_LISTS[portfolioId];
        if (!list) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">❌</div>
                    <p>ポートフォリオが見つかりません</p>
                </div>
            `;
            countEl.textContent = '';
            return;
        }
        
        titleEl.textContent = `${list.icon || '📊'} ${list.name || portfolioId} ${list.description || ''}`;
        
        const matched = getMatchedStocks(portfolioId);
        countEl.textContent = `共 ${matched.length} 只标的`;
        
        if (matched.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">🔍</div>
                    <p>${list.name || portfolioId} の銘柄は Watchlist に含まれていません</p>
                    <p style="font-size:13px;color:#94a3b8;margin-top:8px;">💡 現在のWatchlist: ${allStocks.length}件</p>
                </div>
            `;
            return;
        }
        
        // ⭐ 表示モードに応じてレンダリングを切り替え
        if (currentViewMode === 'group') {
            renderGroupedStocks(matched, container);
        } else {
            renderFlatStocks(matched, container);
        }
    }

    // ============================================================
    // 7. グループ表示（Sector → Industry）
    // ============================================================
    function renderGroupedStocks(stocks, container) {
        const marketOrder = { '美股': 0, '日股': 1, 'A股': 2, '港股': 3, '韩股': 4, '德股': 5 };
        
        const sectorGroups = stocks.reduce((acc, stock) => {
            const sectorKey = stock.sector || '未分类板块';
            if (!acc[sectorKey]) acc[sectorKey] = [];
            acc[sectorKey].push(stock);
            return acc;
        }, {});
        
        let html = '';
        
        for (const [sector, sectorStocks] of Object.entries(sectorGroups)) {
            const sectorName = getSectorName(sector);
            const sectorComment = getSectorComment(sector);
            
            html += `
                <div class="sector-section">
                    <h2 class="sector-title">${sectorName}</h2>
                    ${sectorComment ? `<p class="sector-comment">${sectorComment}</p>` : ''}
            `;
            
            const industryGroups = sectorStocks.reduce((acc, stock) => {
                const industryKey = stock.industry || '其他';
                if (!acc[industryKey]) acc[industryKey] = [];
                acc[industryKey].push(stock);
                return acc;
            }, {});
            
            for (const [industry, industryStocks] of Object.entries(industryGroups)) {
                const industryName = getIndustryName(sector, industry);
                const industryComment = getIndustryComment(sector, industry);
                
                html += `
                    <div class="industry-section">
                        <h3 class="industry-title">${industryName}</h3>
                        ${industryComment ? `<p class="industry-comment">${industryComment}</p>` : ''}
                        <div class="stock-grid">
                `;
                
                const sortedStocks = [...industryStocks].sort((a, b) => {
                    const orderA = marketOrder[a.market_type] ?? 999;
                    const orderB = marketOrder[b.market_type] ?? 999;
                    return orderA - orderB;
                });
                
                let currentMarket = '';
                sortedStocks.forEach(stock => {
                    if (stock.market_type !== currentMarket) {
                        currentMarket = stock.market_type;
                        const marketLabel = {
                            '美股': '🇺🇸 美股',
                            '日股': '🇯🇵 日股',
                            'A股': '🇨🇳 A股',
                            '港股': '🇭🇰 港股',
                            '韩股': '🇰🇷 韩股',
                            '德股': '🇩🇪 德股'
                        }[currentMarket] || currentMarket;
                        
                        html += `<div class="market-divider">${marketLabel}</div>`;
                    }
                    
                    html += renderSingleCard(stock);
                });
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            html += `</div>`;
        }
        
        container.innerHTML = html;
    }

    // ============================================================
    // 8. フラット表示（単純グリッド）
    // ============================================================
    function renderFlatStocks(stocks, container) {
        const marketOrder = { '美股': 0, '日股': 1, 'A股': 2, '港股': 3, '韩股': 4, '德股': 5 };
        const sortedStocks = [...stocks].sort((a, b) => {
            const orderA = marketOrder[a.market_type] ?? 999;
            const orderB = marketOrder[b.market_type] ?? 999;
            return orderA - orderB;
        });
        
        let html = '<div class="stock-grid">';
        let currentMarket = '';
        
        sortedStocks.forEach(stock => {
            if (stock.market_type !== currentMarket) {
                currentMarket = stock.market_type;
                const marketLabel = {
                    '美股': '🇺🇸 美股',
                    '日股': '🇯🇵 日股',
                    'A股': '🇨🇳 A股',
                    '港股': '🇭🇰 港股',
                    '韩股': '🇰🇷 韩股',
                    '德股': '🇩🇪 德股'
                }[currentMarket] || currentMarket;
                
                html += `<div class="market-divider">${marketLabel}</div>`;
            }
            
            html += renderSingleCard(stock);
        });
        
        html += '</div>';
        container.innerHTML = html;
    }

    // ============================================================
    // 9. 単一カードレンダリング
    // ============================================================
    function renderSingleCard(stock) {
        const formattedFeature = stock.feature ? stock.feature.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') : '';
        const colorClass = stock.isUp ? 'text-up' : 'text-down';
        const trendClass = stock.trend === '牛市多头' ? 'trend-up-bg' : 'trend-down-bg';
        
        let tagsHtml = '';
        if (typeof renderTags === 'function') {
            tagsHtml = renderTags(
                Array.isArray(stock.tags) ? stock.tags : [],
                Array.isArray(stock.tag_themes) ? stock.tag_themes : [],
                Array.isArray(stock.display_tags) ? stock.display_tags : []
            );
        }
        
        let shortBadge = '';
        if (typeof renderShortBadge === 'function') {
            shortBadge = renderShortBadge(stock.code);
        }
        
        let bigMoveMark = '';
        if (typeof getBigMoveMark === 'function') {
            bigMoveMark = getBigMoveMark(stock.change);
        }
        
        let memoHtml = '';
        if (typeof renderMemoHTML === 'function') {
            memoHtml = renderMemoHTML(stock);
        }
        
        return `
            <div class="stock-card">
                <div class="stock-header">
                    <div class="stock-title">
                        <a href="${getYahooUrl(stock)}" target="_blank" style="text-decoration: none; color: inherit;">
                            <h3>${getMarketBadge(stock.market_type)} ${stock.name || ''}</h3>
                        </a>
                        <span class="industry-tag">${getIndustryName(stock.sector, stock.industry) || '其他'}</span>
                        ${shortBadge}
                    </div>
                    <div class="stock-actions">
                        <span class="stock-code" onclick="copyToClipboard('${stock.code || ''}')" title="点击复制代码">
                            ${stock.code || ''}
                        </span>
                        <a href="${getTradingViewUrl(stock)}" target="_blank" class="tv-link" title="在 TradingView 查看走势">
                            📈
                        </a>
                    </div>
                </div>
                <div class="stock-feature">${formattedFeature}</div>
                
                <div class="tag-container">
                    ${tagsHtml}
                </div>

                <div class="stock-trend-badge ${trendClass}">${stock.trend || '--'}</div>
                <div class="price-row">
                    <div class="stock-price ${colorClass}">${stock.price || '--'}</div>
                    <div class="stock-change ${colorClass}">
                        ${stock.change || '--'}
                        ${bigMoveMark}
                    </div>
                </div>
                
                <table class="metrics-table" style="margin-bottom: 6px;">
                    <thead>
                        <tr>
                            <th style="width: 33.33%;">
                                <a href="#" onclick="openTargetPrice('${stock.code || ''}'); return false;" style="color: #2563eb; text-decoration: none; cursor: pointer; border-bottom: 1px dashed #2563eb;">
                                    PER 估值 📊
                                </a>
                            </th>
                            <th style="width: 33.33%;">ROE</th>
                            <th style="width: 33.33%;">PBR 溢价</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>${judgeValuation(stock.per, 'PER')}</td>
                            <td>${judgeROE(stock.roe)}</td>
                            <td>${judgeValuation(stock.pbr, 'PBR')}</td>                                            
                        </tr>
                    </tbody>
                </table>

                <table class="metrics-table">
                    <thead>
                        <tr>
                            <th style="width: 25%;">距1周高</th>
                            <th style="width: 25%;">距1月高</th>
                            <th style="width: 25%;">距52周高</th>
                            <th style="width: 25%;">年初高</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="font-weight: 600; color: #1e293b; font-size: 12px;">
                            <td>${stock.distWeek || '--'}</td>
                            <td>${stock.distMonth || '--'}</td>
                            <td>${stock.distHigh || '--'}</td>
                            <td style="color: ${parseFloat(stock.ytdChange) >= 0 ? 'var(--up-color)' : 'var(--down-color)'};">${stock.ytdChange || '--'}</td>
                        </tr>
                    </tbody>
                </table>
                
                ${memoHtml}
            </div>
        `;
    }

    // ============================================================
    // 10. データ読み込み
    // ============================================================
    async function loadPortfolioData() {
        try {
            if (typeof loadSectorMapping === 'function') {
                await loadSectorMapping();
            }
            
            const response = await fetch('/data/data.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error('データ読み込み失敗');
            const data = await response.json();
            allStocks = data.stocks || [];
            console.log(`📊 銘柄データ読み込み完了: ${allStocks.length}件`);
            
            await loadPortfolioLists();
            
            renderTabs();
            
            const firstId = Object.keys(PORTFOLIO_LISTS)[0];
            if (firstId) {
                switchPortfolio(firstId);
            }
            
            console.log(`📊 portfolio.html 読み込み完了`);
            
        } catch (error) {
            console.error('データ読み込み失敗:', error);
            document.getElementById('stockGridContainer').innerHTML = `
                <div class="empty-state">
                    <div class="emoji">⚠️</div>
                    <p>データ読み込みに失敗しました</p>
                    <p style="font-size:13px;color:#94a3b8;margin-top:8px;">${error.message}</p>
                </div>
            `;
        }
    }

    // ============================================================
    // 11. 起動
    // ============================================================
    window.onload = function() {
        loadPortfolioData();
    };
    
    // グローバルに公開
    window.setViewMode = setViewMode;
    window.switchPortfolio = switchPortfolio;
    </script>
</body>
</html>
