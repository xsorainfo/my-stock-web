<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>配置管理</title><link rel="stylesheet" href="../components/common.css"><link rel="stylesheet" href="../components/navbar.css"><style>body{font-family:Arial,sans-serif}.wrap{max-width:1200px;margin:24px auto;padding:16px}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{padding:8px 12px;border:0;border-radius:8px;cursor:pointer}.tabs .active{background:#2563eb;color:#fff}textarea{width:100%;min-height:60vh;box-sizing:border-box;font:13px monospace;padding:12px;border:1px solid #cbd5e1;border-radius:8px}input{padding:10px;width:260px;border:1px solid #cbd5e1;border-radius:8px}button.save{margin-top:12px;padding:10px 18px;background:#16a34a;color:white;border:0;border-radius:8px;cursor:pointer}button.save:disabled{opacity:.6;cursor:wait}.hint{color:#64748b;font-size:13px;line-height:1.6}</style></head><body><div id="navbar-placeholder"></div><main class="wrap"><h2>配置管理</h2><p class="hint">编辑 WATCHLIST、板块映射、标签映射、主题映射和组合列表。删除或添加条目后点击保存。保存会直接创建 GitHub 提交，请先备份。</p><input id="password" type="password" placeholder="配置编辑密码"><div class="tabs" id="tabs"></div><div class="panel"><textarea id="content" spellcheck="false"></textarea><br><button class="save" id="save">保存当前配置</button><p id="status"></p></div></main><script src="../components/navbar.js"></script><script>
let dirty=false;const configs={watchlist:'WATCHLIST',sector_mapping:'sector_mapping',tag_display_map:'TAG_DISPLAY_MAP',theme_mapping:'THEME_MAPPING',portfolio_lists:'PORTFOLIO_LISTS'};let current='watchlist';
const tabs=document.getElementById('tabs');Object.entries(configs).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>load(k);b.dataset.key=k;tabs.append(b)});
function auth(){return 'Bearer '+document.getElementById('password').value}
async function load(k){current=k;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.key===k));const r=await fetch('/api/update_config?key='+k,{headers:{Authorization:auth()}});const d=await r.json();document.getElementById('content').value=d.content||'';dirty=false;document.getElementById('status').textContent=r.ok?'已加载 '+k:(d.error||'加载失败')}
document.getElementById('content').addEventListener('input',()=>{dirty=true;document.getElementById('status').textContent='有未保存修改'});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});document.getElementById('save').onclick=async()=>{const status=document.getElementById('status');const save=document.getElementById('save');if(!document.getElementById('password').value.trim()){status.textContent='请先输入配置编辑密码';return;}save.disabled=true;status.textContent='保存中…';const r=await fetch('/api/update_config?key='+current,{method:'PUT',headers:{Authorization:auth(),'Content-Type':'application/json'},body:JSON.stringify({key:current,content:document.getElementById('content').value})});const d=await r.json();dirty=!r.ok;status.textContent=r.ok?'已保存，下一次数据更新后生效':(d.error||'保存失败');save.disabled=false};load(current);
</script></body></html>
