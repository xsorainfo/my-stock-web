<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総合</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
    
    <!-- ⭐ 引入共通样式 -->
    <link rel="stylesheet" href="../components/common.css">
    <!-- ⭐ 引入导航栏样式 -->
    <link rel="stylesheet" href="../components/navbar.css">
    
    <style>
        /* ============================================================
           index.html 特有样式
           ============================================================ */
        
        /* ===== 容器 ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 8px;
        }

        /* ===== 头部 ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
        }

        /* ===== AI 简报 ===== */
        .ai-briefboard {
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 28px;
        }

        .ai-title {
            font-weight: 600;
            color: #1e40af;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .ai-content {
            font-size: 14px;
            color: #334155;
        }

        /* ===== 宏观数据 ===== */
        .macro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .macro-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
        }

        .macro-name {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .macro-price {
            font-size: 22px;
            font-weight: 700;
        }
        

        /* ===== Sector（一级） ===== */
        .sector-section {
            margin-bottom: 40px;
        }

        .sector-title {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 8px;
            border-left: 4px solid #2563eb;
            color: #ffffff;
        }

        .sector-comment {
            font-family: 'Zen Maru Gothic', 'Hiragino Sans', 'Noto Sans SC', sans-serif;
            font-size: 13px;
            color: #00035b;
            margin: -6px 0 18px 16px;
            padding: 6px 0;
            background: transparent;
            border-bottom: 2px dashed #e2e8f0;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }

        /* ===== Industry（二级） ===== */
        .industry-section {
            margin-bottom: 28px;
            margin-left: 16px;
        }

        .industry-title {
            font-size: 17px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
            padding: 6px 14px;
            background: #f8fafc;
            border-radius: 4px;
            border-left: 3px solid #2563eb;
        }

        .industry-comment {
            font-family: 'Zen Maru Gothic', 'Hiragino Sans', 'Noto Sans SC', sans-serif;
            font-size: 13px;
            color: #00035b;
            margin: -4px 0 14px 28px;
            padding: 4px 0;
            background: transparent;
            border-bottom: 1.5px dashed #eaeef5;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }

        /* ⭐ 覆盖 common.css，保持 4 列 */
        .stock-grid {
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }

        /* ===== 股票卡片（覆盖 common.css） ===== */
        .stock-card .stock-feature {
            min-height: 52px;
        }
    </style>
</head>
<body>
    <!-- 导航栏占位符 -->
    <div id="navbar-placeholder"></div>
    
    <div class="container">
        <div class="ai-briefboard">
            <div class="ai-title">🤖 首席硬科技策略师 · 盘后多头思维复盘</div>
            <div class="ai-content" id="aiReport">正在读取策略官核心简报流...</div>
        </div>

        <div class="macro-grid" id="macroGrid"></div>

        <h2 class="section-title">AI 半导体与全要素核心标的集群</h2>
        <div id="industryContainer"></div>
    </div>

    <!-- 引入脚本 -->
    <script src="../components/navbar.js"></script>
    <script src="../components/common.js"></script>
    
    <script>
    // ============================================================
    // index.html 特有逻辑
    // ============================================================
    
    async function loadDashboardData() {
        try {
            const response = await fetch('/data/data.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error('数据加载失败');
            const data = await response.json();

            document.getElementById('aiReport').innerText = data.ai_report || '💡 数据就绪。';

            // 宏观数据渲染
            const macroGrid = document.getElementById('macroGrid');
            macroGrid.innerHTML = '';
            data.macro?.forEach(item => {
                const colorClass = item.isUp ? 'text-up' : 'text-down';
                macroGrid.innerHTML += `
                    <div class="macro-card">
                        <div class="macro-name">${item.name}</div>
                        <div class="macro-price ${colorClass}">${item.price}</div>
                        <div class="macro-change ${colorClass}">${item.change}</div>
                    </div>`;
            });

            // 两层分组
            const container = document.getElementById('industryContainer');
            container.innerHTML = '';
            
            const sectorGroups = data.stocks.reduce((acc, stock) => {
                const sectorKey = stock.sector || '未分类板块';
                if (!acc[sectorKey]) acc[sectorKey] = [];
                acc[sectorKey].push(stock);
                return acc;
            }, {});

            for (const [sector, sectorStocks] of Object.entries(sectorGroups)) {
                const sectorDiv = document.createElement('div');
                sectorDiv.className = 'sector-section';
                
                const sectorName = getSectorName(sector);
                const sectorComment = getSectorComment(sector);
                
                sectorDiv.innerHTML = `
                    <h2 class="sector-title">${sectorName}</h2>
                    ${sectorComment ? `<p class="sector-comment">${sectorComment}</p>` : ''}
                `;
                
                const industryGroups = sectorStocks.reduce((acc, stock) => {
                    const industryKey = stock.industry || '其他';
                    if (!acc[industryKey]) acc[industryKey] = [];
                    acc[industryKey].push(stock);
                    return acc;
                }, {});
            
                for (const [industry, industryStocks] of Object.entries(industryGroups)) {
                    const industryDiv = document.createElement('div');
                    industryDiv.className = 'industry-section';
                    
                    const industryName = getIndustryName(sector, industry);
                    const industryComment = getIndustryComment(sector, industry);
                    
                    industryDiv.innerHTML = `
                        <h3 class="industry-title">${industryName}</h3>
                        ${industryComment ? `<p class="industry-comment">${industryComment}</p>` : ''}
                    `;
                    
                    const grid = document.createElement('div');
                    grid.className = 'stock-grid';
                    
                    industryStocks.forEach(stock => {
                        const formattedFeature = stock.feature.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        const colorClass = stock.isUp ? 'text-up' : 'text-down';
                        const trendClass = stock.trend === '牛市多头' ? 'trend-up-bg' : 'trend-down-bg';
                        const tagsHtml = stock.tags ? renderTags(stock.tags) : '';
                        
                        grid.innerHTML += `
                            <div class="stock-card">
                                <div class="stock-header">
                                    <div class="stock-title">
                                        <a href="${getYahooUrl(stock)}" target="_blank" style="text-decoration: none; color: inherit;">
                                            <h3>${getMarketBadge(stock.market_type)} ${stock.name}</h3>
                                        </a>
                                    </div>
                                    <div class="stock-actions">
                                        <span class="stock-code" onclick="copyToClipboard('${stock.code}')" title="点击复制代码">
                                            ${stock.code}
                                        </span>
                                        <a href="${getTradingViewUrl(stock)}" target="_blank" class="tv-link" title="在 TradingView 查看走势">
                                            📈
                                        </a>
                                    </div>
                                </div>
                                <div class="stock-feature">${formattedFeature}</div>
                                
                                <div class="tag-container">
                                    ${tagsHtml}
                                </div>

                                <div class="stock-trend-badge ${trendClass}">${stock.trend}</div>
                                <div class="price-row">
                                    <div class="stock-price ${colorClass}">${stock.price}</div>
                                    <div class="stock-change ${colorClass}">${stock.change}</div>
                                </div>
                                
                                <table class="metrics-table" style="margin-bottom: 6px;">
                                    <thead>
                                        <tr>
                                            <th style="width: 33.33%;">
                                                <a href="#" onclick="openTargetPrice('${stock.code}'); return false;" style="color: #2563eb; text-decoration: none; cursor: pointer; border-bottom: 1px dashed #2563eb;">
                                                    PER 估值 📊
                                                </a>
                                            </th>
                                            <th style="width: 33.33%;">ROE</th>
                                            <th style="width: 33.33%;">PBR 溢价</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>${judgeValuation(stock.per, 'PER')}</td>
                                            <td>${judgeROE(stock.roe)}</td>
                                            <td>${judgeValuation(stock.pbr, 'PBR')}</td>                                            
                                        </tr>
                                    </tbody>
                                </table>

                                <table class="metrics-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 25%;">距1周高</th>
                                            <th style="width: 25%;">距1月高</th>
                                            <th style="width: 25%;">距52周高</th>
                                            <th style="width: 25%;">年初高</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr style="font-weight: 600; color: #1e293b; font-size: 12px;">
                                            <td>${stock.distWeek || '--'}</td>
                                            <td>${stock.distMonth || '--'}</td>
                                            <td>${stock.distHigh || '--'}</td>
                                            <td style="color: ${parseFloat(stock.ytdChange) >= 0 ? 'var(--up-color)' : 'var(--down-color)'};">${stock.ytdChange || '--'}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>`;
                    });

                    industryDiv.appendChild(grid);
                    sectorDiv.appendChild(industryDiv);
                }
                
                container.appendChild(sectorDiv);
            }
        } catch (error) { 
            console.error('加载数据失败:', error);
        }
    }

    window.onload = async function() {
        await loadSectorMapping();
        await loadDashboardData();
    };
    </script>
</body>
</html>
