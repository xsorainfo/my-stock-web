<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総合</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
    
    <!-- ⭐ 引入共通样式 -->
    <link rel="stylesheet" href="../components/common.css">
    <!-- ⭐ 引入导航栏样式 -->
    <link rel="stylesheet" href="../components/navbar.css">
    
    <style>
        /* ============================================================
           index.html 特有样式
           ============================================================ */
        
        /* ===== 容器 ===== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 8px;
        }

        /* ===== 头部 ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
        }

        /* ===== AI 简报 ===== */
        .ai-briefboard {
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 28px;
        }

        .ai-title {
            font-weight: 600;
            color: #1e40af;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .ai-content {
            font-size: 14px;
            color: #334155;
        }
        /* ===== 宏观数据折叠 ===== */
        .macro-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            padding: 8px 16px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 16px;
            transition: background 0.2s;
            border: 1px solid #e2e8f0;
        }
        
        .macro-toggle:hover {
            background: #e2e8f0;
        }
        
        .macro-toggle .arrow {
            font-size: 12px;
            transition: transform 0.3s ease;
            display: inline-block;
        }
        
        .macro-toggle .arrow.open {
            transform: rotate(90deg);
        }
        
        .macro-toggle .label {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
        }
        
        .macro-toggle .count {
            font-size: 12px;
            color: #94a3b8;
            margin-left: auto;
        }
        
        .macro-grid-wrapper {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.4s ease;
        }
        
        .macro-grid-wrapper.open {
            max-height: 5000px;
        }

        /* ===== 宏观数据 ===== */
        .macro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .macro-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            border-left: 3px solid transparent;
            transition: border-color 0.2s, background 0.2s;
        }

        .macro-name {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .macro-price {
            font-size: 22px;
            font-weight: 700;
        }

        /* ===== 宏观数据卡片 - 带颜色边框 ===== */
        .macro-card-futures {
            border-left: 3px solid #f97316 !important;
            background: rgba(249, 115, 22, 0.05) !important;
        }
        /* 外汇 - 浅蓝边框 */
        .macro-card-forex {
            border-left: 3px solid #3b82f6 !important;
            background: rgba(59, 130, 246, 0.05) !important;
        }

        /* 美国 ETF - 紫色边框 */
        .macro-card-etf {
            border-left: 3px solid #8b5cf6 !important;
            background: rgba(139, 92, 246, 0.05) !important;
        }
        
        /* ⭐ 日本 ETF - 橙色边框 */
        .macro-card-j-etf {
            border-left: 3px solid #f97316 !important;
            background: rgba(249, 115, 22, 0.06) !important;
        }
        /* 商品 - 金色边框 */
        .macro-card-commodity {
            border-left: 3px solid #f59e0b !important;
            background: rgba(245, 158, 11, 0.05) !important;
        }
        /* 债券 - 粉色边框 */
        .macro-card-bond {
            border-left: 3px solid #ec4899 !important;
            background: rgba(236, 72, 153, 0.05) !important;
        }
        /* 情绪 - 红色边框 */
        .macro-card-sentiment {
            border-left: 3px solid #ef4444 !important;
            background: rgba(239, 68, 68, 0.05) !important;
        }

        .macro-card-crypto {
            border-left: 3px solid #14b8a6 !important;
            background: rgba(20, 184, 166, 0.05) !important;
        }

        /* ===== Macro Badge 标签样式 ===== */
        .macro-badge {
            display: inline-block;
            font-size: 8px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 3px;
            margin-left: 4px;
            letter-spacing: 0.5px;
            vertical-align: middle;
            line-height: 1.6;
        }

        .macro-badge.index {
            display: none;
        }

        .macro-badge.futures {
            background: #f97316;
            color: #ffffff;
        }

        .macro-badge.forex {
            background: #3b82f6;
            color: #ffffff;
        }

        /* 美国 ETF - 紫色 */
        .macro-badge.etf {
            background: #8b5cf6;
            color: #ffffff;
        }
        
        /* ⭐ 日本 ETF - 橙色 */
        .macro-badge.j-etf {
            background: #f97316;
            color: #ffffff;
        }

        .macro-badge.commodity {
            background: #f59e0b;
            color: #1e293b;
        }

        .macro-badge.bond {
            background: #ec4899;
            color: #ffffff;
        }

        .macro-badge.sentiment {
            background: #ef4444;
            color: #ffffff;
        }

        .macro-badge.crypto {
            background: #14b8a6;
            color: #ffffff;
        }

        /* ===== Sector（一级） ===== */
        .sector-section {
            margin-bottom: 40px;
        }

        .sector-title {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 8px;
            border-left: 4px solid #2563eb;
            color: #ffffff;
        }

        .sector-comment {
            font-family: 'Zen Maru Gothic', 'Hiragino Sans', 'Noto Sans SC', sans-serif;
            font-size: 13px;
            color: #00035b;
            margin: -6px 0 18px 16px;
            padding: 6px 0;
            background: transparent;
            border-bottom: 2px dashed #e2e8f0;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }

        /* ===== Industry（二级） ===== */
        .industry-section {
            margin-bottom: 28px;
            margin-left: 16px;
        }

        .industry-title {
            font-size: 17px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
            padding: 6px 14px;
            background: #f8fafc;
            border-radius: 4px;
            border-left: 3px solid #2563eb;
        }

        .industry-comment {
            font-family: 'Zen Maru Gothic', 'Hiragino Sans', 'Noto Sans SC', sans-serif;
            font-size: 13px;
            color: #00035b;
            margin: -4px 0 14px 28px;
            padding: 4px 0;
            background: transparent;
            border-bottom: 1.5px dashed #eaeef5;
            line-height: 1.8;
            letter-spacing: 0.5px;
        }

        /* ===== 股票卡片 ===== */
        .stock-card .stock-feature {
            min-height: 52px;        
        }

        /* ===== 快捷链接 ===== */
        .quick-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            margin-bottom: 28px;
        }
        
        .quick-links-label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            letter-spacing: 0.5px;
            margin-right: 4px;
        }
        
        .quick-link {
            font-size: 12px;
            color: #140bdb;
            text-decoration: none;
            padding: 4px 10px;
            border-radius: 4px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            transition: all 0.2s ease;
        }
        
        .quick-link:hover {
            background: #2563eb;
            color: #ffffff;
            border-color: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .quick-links {
                gap: 6px 10px;
                padding: 10px 12px;
            }
            .quick-link {
                font-size: 11px;
                padding: 3px 8px;
            }
            .quick-links-label {
                font-size: 11px;
                width: 100%;
                margin-bottom: 2px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏占位符 -->
    <div id="navbar-placeholder"></div>
    
    <div class="container">
        <div class="ai-briefboard">
            <div class="ai-title">🤖 首席硬科技策略师 · 盘后多头思维复盘</div>
            <div class="ai-content" id="aiReport">正在读取策略官核心简报流...</div>
        </div>
        <!-- ===== 快捷链接 ===== -->
        <div class="quick-links">
            <span class="quick-links-label">📌 日本株 分析サイト</span>
            <a href="https://kabutan.jp/" target="_blank" class="quick-link">株たん (Kabutan)</a>
            <a href="https://kabuyoho.jp/" target="_blank" class="quick-link">株予報Pro</a>
            <a href="https://finance.yahoo.co.jp/news/ai-market/" target="_blank" class="quick-link">Yahoo!ファイナンス</a>
            <a href="https://www.nikkei.com/marketdata/ranking-jp/" target="_blank" class="quick-link">日本株ランキング</a>
            <a href="https://www.nikkei.com/markets/" target="_blank" class="quick-link">日本経済新聞</a>
            <a href="https://www.rakuten-sec.co.jp/" target="_blank" class="quick-link">楽天証券</a>
        </div>

       
        <!-- ⭐ 宏观数据（折叠） -->
        <div class="macro-toggle" id="macroToggle">
            <span class="arrow" id="macroArrow">▶</span>
            <span class="label">📊 マクロ指標・業種ETF</span>
            <span class="count" id="macroCount"></span>
        </div>
        <div class="macro-grid-wrapper" id="macroWrapper">
            <div class="macro-grid" id="macroGrid"></div>
        </div>

        <h2 class="section-title">AI 半导体与全要素核心标的集群</h2>
        <div id="industryContainer"></div>
    </div>
    
    <!-- ⭐ Footer 占位符 -->
    <div id="footer-placeholder"></div>

    <!-- 引入脚本 -->
    <script src="../components/navbar.js"></script>
    <script src="../components/common.js"></script>
    <script src="../components/footer.js"></script>
    
    <script>
    // ============================================================
    // index.html 特有逻辑
    // ============================================================
    
    async function loadDashboardData() {
        try {
            const response = await fetch('/data/data.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error('数据加载失败');
            const data = await response.json();
    
            document.getElementById('aiReport').innerText = data.ai_report || '💡 数据就绪。';
    
            // ⭐ 宏观数据渲染（带卡片颜色和标签）
            const macroGrid = document.getElementById('macroGrid');
            macroGrid.innerHTML = data.macro?.map(item => {
                // ⭐ 箭头：上涨用 ↑，下跌用 ↓
                const arrow = item.isUp ? '↑' : '↓';
                // ⭐ 箭头颜色直接写在行内样式（红色上涨，绿色下跌）
                const arrowColor = item.isUp ? '#ef4444' : '#10b981';
                const colorClass = item.isUp ? 'text-up' : 'text-down';
                const badgeLabel = item.badge_label || '';
                const badgeClass = item.badge_class || 'index';
                const badgeHtml = badgeLabel ? `<span class="macro-badge ${badgeClass}">${badgeLabel}</span>` : '';
                
                // 卡片类名：macro-card + 颜色类（如果非 index）
                const cardClass = badgeClass !== 'index' ? `macro-card macro-card-${badgeClass}` : 'macro-card';
                
                return `
                    <div class="${cardClass}">
                        <div class="macro-name">
                            ${item.name}
                            ${badgeHtml}
                        </div>
                        <div class="macro-price ${colorClass}">${item.price}</div>
                        <div class="macro-change ${colorClass}">
                            <span style="color: ${arrowColor};"><b>${arrow}</b></span> ${item.change}
                        </div>
                        
                    </div>
                `;
            }).join('') || '';
    
            // ⭐ 更新计数和折叠状态
            const totalMacro = data.macro?.length || 0;
            document.getElementById('macroCount').textContent = `(${totalMacro})`;
            
            // ⭐ 默认展开（或收起）
            const wrapper = document.getElementById('macroWrapper');
            const arrow = document.getElementById('macroArrow');
            // 如果指标少于等于 6 个，默认展开；多于 6 个默认收起
            if (totalMacro <= 6) {
                wrapper.classList.add('open');
                arrow.classList.add('open');
            }
    
    
            // ⭐ 两层分组 + 按市场排序
            const container = document.getElementById('industryContainer');
            container.innerHTML = '';
            
            // 按市场定义排序优先级
            const marketOrder = { '美股': 0, '日股': 1, 'A股': 2, '港股': 3, '韩股': 4, '德股': 5 };
            
            // 按 sector 分组
            const sectorGroups = data.stocks.reduce((acc, stock) => {
                const sectorKey = stock.sector || '未分类板块';
                if (!acc[sectorKey]) acc[sectorKey] = [];
                acc[sectorKey].push(stock);
                return acc;
            }, {});
    
            for (const [sector, sectorStocks] of Object.entries(sectorGroups)) {
                const sectorDiv = document.createElement('div');
                sectorDiv.className = 'sector-section';
                
                const sectorName = getSectorName(sector);
                const sectorComment = getSectorComment(sector);
                
                sectorDiv.innerHTML = `
                    <h2 class="sector-title">${sectorName}</h2>
                    ${sectorComment ? `<p class="sector-comment">${sectorComment}</p>` : ''}
                `;
                
                // ⭐ 按 industry 分组
                const industryGroups = sectorStocks.reduce((acc, stock) => {
                    const industryKey = stock.industry || '其他';
                    if (!acc[industryKey]) acc[industryKey] = [];
                    acc[industryKey].push(stock);
                    return acc;
                }, {});
            
                for (const [industry, industryStocks] of Object.entries(industryGroups)) {
                    const industryDiv = document.createElement('div');
                    industryDiv.className = 'industry-section';
                    
                    const industryName = getIndustryName(sector, industry);
                    const industryComment = getIndustryComment(sector, industry);
                    
                    industryDiv.innerHTML = `
                        <h3 class="industry-title">${industryName}</h3>
                        ${industryComment ? `<p class="industry-comment">${industryComment}</p>` : ''}
                    `;
                    
                    const grid = document.createElement('div');
                    grid.className = 'stock-grid';
                    
                    // ⭐ 按市场排序：美股 → 日股 → A股
                    const sortedStocks = [...industryStocks].sort((a, b) => {
                        const orderA = marketOrder[a.market_type] ?? 999;
                        const orderB = marketOrder[b.market_type] ?? 999;
                        return orderA - orderB;
                    });
                    
                    // ⭐ 添加市场分隔标题
                    let currentMarket = '';
                    let marketHeader = '';
                    
                    sortedStocks.forEach(stock => {
                        // 如果市场变了，插入市场分隔标题
                        if (stock.market_type !== currentMarket) {
                            currentMarket = stock.market_type;
                            const marketLabel = {
                                '美股': '🇺🇸 美股',
                                '日股': '🇯🇵 日股',
                                'A股': '🇨🇳 A股',
                                '港股': '🇭🇰 港股',
                                '韩股': '🇰🇷 韩股',
                                '德股': '🇩🇪 德股'
                            }[currentMarket] || currentMarket;
                            
                            marketHeader = `<div class="market-divider">${marketLabel}</div>`;
                            grid.innerHTML += marketHeader;
                        }
                        
                        // 渲染股票卡片
                        const formattedFeature = stock.feature.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        const colorClass = stock.isUp ? 'text-up' : 'text-down';
                        const trendClass = stock.trend === '牛市多头' ? 'trend-up-bg' : 'trend-down-bg';

                        const tagsHtml = renderTags(stock.tags, stock.tag_themes, stock.display_tags);
                        
                        grid.innerHTML += `
                            <div class="stock-card">
                                <div class="stock-header">
                                    <div class="stock-title">
                                        <a href="${getYahooUrl(stock)}" target="_blank" style="text-decoration: none; color: inherit;">
                                            <h3>${getMarketBadge(stock.market_type)} ${stock.name}</h3>
                                        </a>
                                    </div>
                                    <div class="stock-actions">
                                        <span class="stock-code" onclick="copyToClipboard('${stock.code}')" title="点击复制代码">
                                            ${stock.code}
                                        </span>
                                        <a href="${getTradingViewUrl(stock)}" target="_blank" class="tv-link" title="在 TradingView 查看走势">
                                            📈
                                        </a>
                                    </div>
                                </div>
                                <div class="stock-feature">${formattedFeature}</div>
                                
                                <div class="tag-container">
                                    ${tagsHtml}
                                </div>
    
                                <div class="stock-trend-badge ${trendClass}">${stock.trend}</div>
                                <div class="price-row">
                                    <div class="stock-price ${colorClass}">${stock.price}</div>
                                    <div class="stock-change ${colorClass}">${stock.change}</div>
                                </div>
                                
                                <table class="metrics-table" style="margin-bottom: 6px;">
                                    <thead>
                                        <tr>
                                            <th style="width: 33.33%;">
                                                <a href="#" onclick="openTargetPrice('${stock.code}'); return false;" style="color: #2563eb; text-decoration: none; cursor: pointer; border-bottom: 1px dashed #2563eb;">
                                                    PER 估值 📊
                                                </a>
                                            </th>
                                            <th style="width: 33.33%;">ROE</th>
                                            <th style="width: 33.33%;">PBR 溢价</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>${judgeValuation(stock.per, 'PER')}</td>
                                            <td>${judgeROE(stock.roe)}</td>
                                            <td>${judgeValuation(stock.pbr, 'PBR')}</td>                                            
                                        </tr>
                                    </tbody>
                                </table>
    
                                <table class="metrics-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 25%;">距1周高</th>
                                            <th style="width: 25%;">距1月高</th>
                                            <th style="width: 25%;">距52周高</th>
                                            <th style="width: 25%;">年初高</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr style="font-weight: 600; color: #1e293b; font-size: 12px;">
                                            <td>${stock.distWeek || '--'}</td>
                                            <td>${stock.distMonth || '--'}</td>
                                            <td>${stock.distHigh || '--'}</td>
                                            <td style="color: ${parseFloat(stock.ytdChange) >= 0 ? 'var(--up-color)' : 'var(--down-color)'};">${stock.ytdChange || '--'}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>`;
                    });
    
                    industryDiv.appendChild(grid);
                    sectorDiv.appendChild(industryDiv);
                }
                
                container.appendChild(sectorDiv);
            }
            
        } catch (error) { 
            console.error('加载数据失败:', error);
        }
    }
    // ⭐ 宏观数据折叠切换
    document.getElementById('macroToggle').addEventListener('click', function() {
        const wrapper = document.getElementById('macroWrapper');
        const arrow = document.getElementById('macroArrow');
        wrapper.classList.toggle('open');
        arrow.classList.toggle('open');
    });

    window.onload = async function() {
        await loadSectorMapping();
        await loadDashboardData();
    };
    </script>
</body>
</html>
