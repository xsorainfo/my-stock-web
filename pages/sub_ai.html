<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 AI テーマ別</title>
    
    <!-- ⭐ 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    
    <!-- ⭐ 共通样式 -->
    <link rel="stylesheet" href="../components/common.css">
    <!-- ⭐ 导航栏样式 -->
    <link rel="stylesheet" href="../components/navbar.css">
    
    <style>
        /* ============================================================
           sub_ai.html 特有样式
           ============================================================ */
        
        :root {
            --sidebar-width: 320px;
            --nav-height: 64px;
        }

        body {
            height: 100vh;
            overflow: hidden;
        }

        /* ===== 主体布局 ===== */
        .main-layout {
            display: flex;
            height: calc(100vh - var(--nav-height));
            overflow: hidden;
        }

        /* ===== 左侧边栏 ===== */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: #ffffff;
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            padding: 16px 0;
            flex-shrink: 0;
        }

        .sidebar::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* ===== 一级菜单 ===== */
        .menu-level1 {
            border-bottom: 1px solid #f1f5f9;
        }

        .menu-level1:last-child {
            border-bottom: none;
        }

        .menu-level1-header {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 14px;
            color: #0f172a;
            user-select: none;
            gap: 10px;
        }

        .menu-level1-header:hover {
            background: #f1f5f9;
        }

        .menu-level1-header .arrow {
            transition: transform 0.25s ease;
            font-size: 12px;
            color: #94a3b8;
            margin-left: auto;
        }

        .menu-level1-header .arrow.open {
            transform: rotate(90deg);
        }

        .menu-level1-header .count {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 400;
            margin-left: 4px;
        }

        .menu-level1-header.active {
            background: #eff6ff;
            color: #2563eb;
        }

        /* ===== 二级菜单 ===== */
        .menu-level2-container {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
            background: #f8fafc;
        }

        .menu-level2-container.open {
            max-height: 2000px;
        }

        .menu-level2-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px 8px 40px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 13px;
            color: #475569;
            user-select: none;
            border-left: 3px solid transparent;
        }

        .menu-level2-header:hover {
            background: #f1f5f9;
            color: #1e293b;
        }

        .menu-level2-header .arrow {
            transition: transform 0.25s ease;
            font-size: 10px;
            color: #94a3b8;
        }

        .menu-level2-header .arrow.open {
            transform: rotate(90deg);
        }

        .menu-level2-header .count {
            font-size: 10px;
            color: #94a3b8;
            background: #f1f5f9;
            padding: 0 8px;
            border-radius: 10px;
        }

        .menu-level2-header.active {
            background: #eff6ff;
            color: #2563eb;
            border-left-color: #2563eb;
            font-weight: 500;
        }

        .menu-level2-header.active .count {
            background: #bfdbfe;
            color: #1d4ed8;
        }

        /* ===== 三级菜单 ===== */
        .menu-level3-container {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.25s ease;
            background: #fafafa;
        }

        .menu-level3-container.open {
            max-height: 1000px;
        }

        .menu-level3-item {
            display: flex;
            align-items: center;
            padding: 6px 20px 6px 60px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 12px;
            color: #64748b;
            border-left: 2px solid transparent;
            user-select: none;
            gap: 6px;
        }

        .menu-level3-item:hover {
            background: #f1f5f9;
            color: #1e293b;
        }

        .menu-level3-item.active {
            background: #eff6ff;
            color: #2563eb;
            border-left-color: #2563eb;
            font-weight: 500;
        }

        .menu-level3-item .count {
            font-size: 9px;
            color: #94a3b8;
            background: #f1f5f9;
            padding: 0 6px;
            border-radius: 8px;
            margin-left: auto;
        }

        .menu-level3-item.active .count {
            background: #bfdbfe;
            color: #1d4ed8;
        }

        /* ===== 右侧内容区 ===== */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            background: #f8fafc;
        }

        .content-area::-webkit-scrollbar {
            width: 6px;
        }
        .content-area::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .page-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }

        .page-header .subtitle {
            font-size: 13px;
            color: #94a3b8;
        }

        /* ===== 覆盖 common.css ===== */
        .stock-feature {
            font-family: 'Kosugi Maru', 'Hiragino Sans', 'Noto Sans SC', sans-serif;
            color: #64748b;
        }

        .stock-feature strong {
            font-family: 'Kosugi Maru', 'Hiragino Sans', 'Noto Sans SC', sans-serif;
            color: #1e293b;
            font-weight: 700;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .sidebar {
                width: 240px;
                min-width: 240px;
            }
            .content-area {
                padding: 16px;
            }
            .menu-level2-item {
                padding-left: 32px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                width: 200px;
                min-width: 200px;
            }
            .menu-level1-header {
                padding: 10px 12px;
                font-size: 13px;
            }
            .menu-level2-header {
                padding: 6px 12px 6px 28px;
                font-size: 12px;
            }
            .menu-level3-item {
                padding: 4px 12px 4px 40px;
                font-size: 11px;
            }
            .page-header h2 {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏占位符 -->
    <div id="navbar-placeholder"></div>

    <!-- ===== 主体布局 ===== -->
    <div class="main-layout">

        <!-- ===== 左侧菜单 ===== -->
        <div class="sidebar" id="sidebar">
            <!-- 由 JavaScript 动态生成 -->
        </div>

        <!-- ===== 右侧内容 ===== -->
        <div class="content-area" id="contentArea">
            <div class="page-header">
                <h2 id="pageTitle">📂 请选择左侧主题</h2>
                <span class="subtitle" id="stockCount"></span>
            </div>
            <div id="stockGridContainer">
                <div class="empty-state">
                    <div class="emoji">👈</div>
                    <p>从左侧选择主题查看对应的股票</p>
                </div>
            </div>
        </div>

    </div>

    <!-- 引入脚本 -->
    <script src="../components/navbar.js"></script>
    <script>
        // ============================================================
        // 1. 全局数据
        // ============================================================
        let allStocks = [];
        let themeMapping = {};
        let currentSelected = null;

        // ============================================================
        // 2. 工具函数
        // ============================================================
        function getMarketBadge(type) {
            const map = {
                '美股': '🇺🇸',
                '日股': '🇯🇵',
                'A股': '🇨🇳',
                '韩股': '🇰🇷',
                '德股': '🇩🇪'
            };
            return map[type] || '🌍';
        }

        function getYahooUrl(stock) {
            if (stock.market_type === '日股') {
                return `https://finance.yahoo.co.jp/quote/${stock.code}`;
            }
            if (stock.market_type === 'A股') {
                const prefix = (stock.code.startsWith('6')) ? 'sh' : 'sz';
                return `https://finance.sina.com.cn/realstock/company/${prefix}${stock.code}/nc.shtml`;
            }
            return `https://finance.yahoo.co.jp/quote/${stock.code}`;
        }

        function getTradingViewUrl(stock) {
            if (stock.market_type === '日股') {
                const cleanCode = stock.code.split('.')[0];
                return `https://jp.tradingview.com/symbols/TSE-${cleanCode}/`;
            } else if (stock.market_type === 'A股') {
                const prefix = stock.code.startsWith('6') ? "SHSE" : "SZSE";
                return `https://www.tradingview.com/symbols/${prefix}-${stock.code}/`;
            }
            return `https://www.tradingview.com/symbols/${stock.code}/`;
        }

        function judgeValuation(val, type) {
            if (!val || val === '--' || isNaN(parseFloat(val))) {
                return '<span class="val-badge val-normal">--</span>';
            }
            const num = parseFloat(val);
            if (type === 'PER' || type === 'forward_per') {
                if (num > 50) return `<span class="val-badge val-high">${num.toFixed(1)} 高估值</span>`;
                if (num < 25) return `<span class="val-badge val-low">${num.toFixed(1)} 具性价比</span>`;
                return `<span class="val-badge val-normal">${num.toFixed(1)} 合理</span>`;
            } else if (type === 'PBR') {
                if (num > 15) return `<span class="val-badge val-high">${num.toFixed(1)} 高溢价</span>`;
                if (num < 3) return `<span class="val-badge val-low">${num.toFixed(1)} 净资产防守</span>`;
                return `<span class="val-badge val-normal">${num.toFixed(1)} 正常</span>`;
            }
            return `<span class="val-badge val-normal">${num}</span>`;
        }

        function judgeROE(roe) {
            if (!roe || roe === '--' || isNaN(parseFloat(roe))) {
                return '<span class="val-badge val-normal">--</span>';
            }
            const num = parseFloat(roe);
            if (num >= 15) return `<span class="val-badge" style="background:#d1fae5;color:#065f46;">🟢 ${roe} 優秀</span>`;
            if (num >= 10) return `<span class="val-badge" style="background:#dbeafe;color:#1d4ed8;">🔵 ${roe} 良好</span>`;
            if (num >= 5) return `<span class="val-badge" style="background:#fef3c7;color:#92400e;">🟡 ${roe} 一般</span>`;
            return `<span class="val-badge" style="background:#fee2e2;color:#b91c1c;">🔴 ${roe} 不佳</span>`;
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                console.log('已复制: ' + text);
            }).catch(err => {
                console.error('复制失败: ', err);
            });
        }

        function openTargetPrice(symbol) {
            let cleanCode = symbol;
            if (symbol.includes('.')) {
                cleanCode = symbol.split('.')[0];
            }
            const url = `https://kabuyoho.jp/sp/reportTarget?bcode=${cleanCode}`;
            window.open(url, '_blank');
        }


        // ============================================================
        // 3. 渲染左侧菜单（三级）
        // ============================================================
        function renderSidebar(themeMapping, stocks) {
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = '';

            // 构建 tag → stocks 索引
            const tagStockMap = {};
            stocks.forEach(stock => {
                if (stock.tag_themes) {
                    stock.tag_themes.forEach(t => {
                        if (t.theme_path && t.theme_path.length > 0) {
                            const tag = t.tag;
                            if (!tagStockMap[tag]) tagStockMap[tag] = [];
                            tagStockMap[tag].push(stock);
                        }
                    });
                }
            });

            // 遍历一级分类
            for (const [level1Key, level1Value] of Object.entries(themeMapping)) {
                if (typeof level1Value !== 'object' || Array.isArray(level1Value)) continue;

                const menuDiv = document.createElement('div');
                menuDiv.className = 'menu-level1';

                // ---- 统计该一级下所有股票总数 ----
                let totalCount = 0;
                const allLevel1Tags = [];
                for (const subTags of Object.values(level1Value)) {
                    if (Array.isArray(subTags)) {
                        subTags.forEach(tag => {
                            allLevel1Tags.push(tag);
                            if (tagStockMap[tag]) totalCount += tagStockMap[tag].length;
                        });
                    }
                }

                // ---- 一级菜单头 ----
                const header = document.createElement('div');
                header.className = 'menu-level1-header';
                header.dataset.level1 = level1Key;
                header.innerHTML = `
                    <span class="icon">📂</span>
                    <span>${level1Key}</span>
                    <span class="count">(${totalCount})</span>
                    <span class="arrow">▶</span>
                `;

                // ⭐ 点击一级菜单：展开/收起 + 显示该一级下所有股票
                header.addEventListener('click', function() {
                    const container = this.nextElementSibling;
                    const isOpen = container.classList.contains('open');
                    container.classList.toggle('open');
                    this.querySelector('.arrow').classList.toggle('open');
                    
                    const level1Key = this.dataset.level1;
                    const allTags = getAllTagsForLevel1(level1Key, themeMapping);
                    
                    document.querySelectorAll('.menu-level1-header').forEach(el => el.classList.remove('active'));
                    document.querySelectorAll('.menu-level2-header').forEach(el => el.classList.remove('active'));
                    document.querySelectorAll('.menu-level3-item').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    
                    document.getElementById('pageTitle').textContent = `📂 ${level1Key}`;
                    displayStocksByTags(allTags);
                });

                menuDiv.appendChild(header);

                // ---- 二级菜单容器 ----
                const level2Container = document.createElement('div');
                level2Container.className = 'menu-level2-container';

                // 遍历二级分类
                for (const [level2Key, level2Tags] of Object.entries(level1Value)) {
                    if (!Array.isArray(level2Tags)) continue;

                    let level2Count = 0;
                    level2Tags.forEach(tag => {
                        if (tagStockMap[tag]) level2Count += tagStockMap[tag].length;
                    });

                    if (level2Count === 0) continue;

                    // ---- 二级菜单头 ----
                    const level2Header = document.createElement('div');
                    level2Header.className = 'menu-level2-header';
                    level2Header.dataset.level1 = level1Key;
                    level2Header.dataset.level2 = level2Key;
                    level2Header.innerHTML = `
                        <span>📁 ${level2Key}</span>
                        <span class="count">${level2Count}</span>
                        <span class="arrow">▶</span>
                    `;

                    // ⭐ 点击二级菜单：展开/收起三级 + 显示该二级下所有股票
                    level2Header.addEventListener('click', function(e) {
                        e.stopPropagation();
                        
                        const container = this.nextElementSibling;
                        const isOpen = container.classList.contains('open');
                        container.classList.toggle('open');
                        this.querySelector('.arrow').classList.toggle('open');
                        
                        const level1Key = this.dataset.level1;
                        const level2Key = this.dataset.level2;
                        const level2Tags = themeMapping[level1Key][level2Key] || [];
                        
                        document.querySelectorAll('.menu-level2-header').forEach(el => el.classList.remove('active'));
                        document.querySelectorAll('.menu-level1-header').forEach(el => el.classList.remove('active'));
                        document.querySelectorAll('.menu-level3-item').forEach(el => el.classList.remove('active'));
                        this.classList.add('active');
                        
                        document.getElementById('pageTitle').textContent = `📂 ${level1Key} › ${level2Key}`;
                        displayStocksByTags(level2Tags);
                    });

                    // ---- 三级菜单容器 ----
                    const level3Container = document.createElement('div');
                    level3Container.className = 'menu-level3-container';

                    // 遍历三级标签
                    level2Tags.forEach(tag => {
                        const count = tagStockMap[tag] ? tagStockMap[tag].length : 0;
                        if (count === 0) return;

                        const item = document.createElement('div');
                        item.className = 'menu-level3-item';
                        item.dataset.tag = tag;
                        item.innerHTML = `
                            <span>🏷️</span>
                            <span>${tag}</span>
                            <span class="count">${count}</span>
                        `;

                        // ⭐ 点击三级菜单：只显示该 tag 的股票
                        item.addEventListener('click', function(e) {
                            e.stopPropagation();
                            
                            document.querySelectorAll('.menu-level3-item').forEach(el => el.classList.remove('active'));
                            document.querySelectorAll('.menu-level2-header').forEach(el => el.classList.remove('active'));
                            document.querySelectorAll('.menu-level1-header').forEach(el => el.classList.remove('active'));
                            this.classList.add('active');

                            const tagName = this.dataset.tag;
                            const level1 = this.closest('.menu-level1').querySelector('.menu-level1-header').dataset.level1;

                            document.getElementById('pageTitle').textContent = `🏷️ ${level1} › ${tagName}`;
                            displayStocksByTag(tagName);
                        });

                        level3Container.appendChild(item);
                    });

                    level2Container.appendChild(level2Header);
                    level2Container.appendChild(level3Container);
                }

                menuDiv.appendChild(level2Container);
                sidebar.appendChild(menuDiv);
            }

            // 默认展开第一个一级菜单
            const firstHeader = sidebar.querySelector('.menu-level1-header');
            if (firstHeader) {
                const container = firstHeader.nextElementSibling;
                container.classList.add('open');
                firstHeader.querySelector('.arrow').classList.add('open');
                setTimeout(() => { firstHeader.click(); }, 100);
            }
        }

        // ============================================================
        // 获取一级菜单下的所有 tag
        // ============================================================
        function getAllTagsForLevel1(level1Key, themeMapping) {
            const tags = [];
            const level1Value = themeMapping[level1Key];
            if (!level1Value) return tags;
            if (Array.isArray(level1Value)) {
                return level1Value;
            } else if (typeof level1Value === 'object') {
                for (const subValue of Object.values(level1Value)) {
                    if (Array.isArray(subValue)) {
                        tags.push(...subValue);
                    }
                }
            }
            return tags;
        }

        // ============================================================
        // 4. 显示股票（按 tag）
        // ============================================================
        function displayStocksByTag(tagName) {
            const container = document.getElementById('stockGridContainer');
            const countEl = document.getElementById('stockCount');

            const matched = allStocks.filter(stock => {
                if (!stock.tag_themes) return false;
                return stock.tag_themes.some(t => t.tag === tagName && t.theme_path && t.theme_path.length > 0);
            });

            countEl.textContent = `共 ${matched.length} 只标的`;

            if (matched.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">🔍</div>
                        <p>该主题下暂无匹配的股票</p>
                    </div>
                `;
                return;
            }

            renderStockCards(matched, container);
        }

        // ============================================================
        // 5. 显示股票（按多个 tags）
        // ============================================================
        function displayStocksByTags(tagNames) {
            const container = document.getElementById('stockGridContainer');
            const countEl = document.getElementById('stockCount');

            if (!tagNames || tagNames.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">📭</div>
                        <p>该分类下暂无标的</p>
                    </div>
                `;
                countEl.textContent = '共 0 只标的';
                return;
            }

            const matched = allStocks.filter(stock => {
                if (!stock.tag_themes) return false;
                return stock.tag_themes.some(t =>
                    tagNames.includes(t.tag) && t.theme_path && t.theme_path.length > 0
                );
            });

            countEl.textContent = `共 ${matched.length} 只标的`;

            if (matched.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">🔍</div>
                        <p>该分类下暂无匹配的股票</p>
                    </div>
                `;
                return;
            }

            renderStockCards(matched, container);
        }

        // ============================================================
        // 6. 渲染股票卡片
        // ============================================================
        function renderStockCards(stocks, container) {
            // 按市场排序：美股 → 日股 → A股
            const marketOrder = { '美股': 0, '日股': 1, 'A股': 2, '韩股': 3, '德股': 4 };
            const sortedStocks = [...stocks].sort((a, b) => {
                const orderA = marketOrder[a.market_type] ?? 999;
                const orderB = marketOrder[b.market_type] ?? 999;
                return orderA - orderB;
            });

            let html = '<div class="stock-grid">';
            let currentMarket = '';

            sortedStocks.forEach(stock => {
                // 市场分隔标题
                if (stock.market_type !== currentMarket) {
                    currentMarket = stock.market_type;
                    const marketLabel = {
                        '美股': '🇺🇸 美股',
                        '日股': '🇯🇵 日股',
                        'A股': '🇨🇳 A股',
                        '韩股': '🇰🇷 韩股',
                        '德股': '🇩🇪 德股'
                    }[currentMarket] || currentMarket;

                    html += `<div class="market-divider">${marketLabel}</div>`;
                }

                const colorClass = stock.isUp ? 'text-up' : 'text-down';
                const trendClass = stock.trend === '牛市多头' ? 'trend-up-bg' : 'trend-down-bg';
                const formattedFeature = stock.feature.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                const industryName = stock.industry || '其他';

                html += `
                    <div class="stock-card">
                        <div class="stock-header">
                            <div class="stock-title">
                                <a href="${getYahooUrl(stock)}" target="_blank" style="text-decoration: none; color: inherit;">
                                    <h3>${getMarketBadge(stock.market_type)} ${stock.name}</h3>
                                </a>
                                <span class="industry-tag">${industryName}</span>
                            </div>
                            <div class="stock-actions">
                                <span class="stock-code" onclick="copyToClipboard('${stock.code}')" title="点击复制代码">
                                    ${stock.code}
                                </span>
                                <a href="${getTradingViewUrl(stock)}" target="_blank" class="tv-link" title="在 TradingView 查看走势">
                                    📈
                                </a>
                            </div>
                        </div>

                        <div class="stock-feature">${formattedFeature}</div>

                       <div class="tag-container">
                            ${(function() {
                                const result = [];
                                if (stock.tags) {
                                    stock.tags.forEach(tag => {
                                        let foundPath = null;
                                        if (stock.tag_themes) {
                                            for (const t of stock.tag_themes) {
                                                if (t.tag === tag && t.theme_path && t.theme_path.length > 0) {
                                                    foundPath = t.theme_path;
                                                    break;
                                                }
                                            }
                                        }
                                        if (foundPath && foundPath.length >= 2) {
                                            result.push(`${foundPath[0]} › ${tag}`);
                                        } else if (foundPath && foundPath.length === 1) {
                                            result.push(foundPath[0]);
                                        } else {
                                            result.push(tag);
                                        }
                                    });
                                }
                                const unique = [...new Set(result)];
                                return unique.map(text => `<span class="stock-tag theme-tag">${text}</span>`).join('');
                            })()}
                        </div>

                        <div class="stock-trend-badge ${trendClass}">${stock.trend}</div>

                        <div class="price-row">
                            <div class="stock-price ${colorClass}">${stock.price}</div>
                            <div class="stock-change ${colorClass}">${stock.change}</div>
                        </div>

                        <table class="metrics-table" style="margin-bottom: 6px;">
                            <thead>
                                <tr>
                                    <th style="width: 33.33%;">
                                        <a href="#" onclick="openTargetPrice('${stock.code}'); return false;" style="color: #2563eb; text-decoration: none; cursor: pointer; border-bottom: 1px dashed #2563eb;">
                                            PER 估值 📊
                                        </a>
                                    </th>
                                    <th style="width: 33.33%;">ROE</th>
                                    <th style="width: 33.33%;">PBR 溢价</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>${judgeValuation(stock.per, 'PER')}</td>
                                    <td>${judgeROE(stock.roe)}</td>
                                    <td>${judgeValuation(stock.pbr, 'PBR')}</td>
                                </tr>
                            </tbody>
                        </table>

                        <table class="metrics-table">
                            <thead>
                                <tr>
                                    <th style="width: 25%;">距1周高</th>
                                    <th style="width: 25%;">距1月高</th>
                                    <th style="width: 25%;">距52周高</th>
                                    <th style="width: 25%;">年初高</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr style="font-weight: 600; color: #1e293b; font-size: 12px;">
                                    <td>${stock.distWeek || '--'}</td>
                                    <td>${stock.distMonth || '--'}</td>
                                    <td>${stock.distHigh || '--'}</td>
                                    <td style="color: ${parseFloat(stock.ytdChange) >= 0 ? 'var(--up-color)' : 'var(--down-color)'};">${stock.ytdChange || '--'}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            });

            html += '</div>';
            container.innerHTML = html;
        }

        // ============================================================
        // 7. URL 参数处理
        // ============================================================
        function getTagFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('tag');
        }

        function autoSelectTag(tagName, themeMapping) {
            if (!tagName || !themeMapping) return false;

            for (const [level1Key, level1Value] of Object.entries(themeMapping)) {
                if (typeof level1Value !== 'object' || Array.isArray(level1Value)) continue;

                let foundLevel2 = null;
                for (const [level2Key, level2Tags] of Object.entries(level1Value)) {
                    if (Array.isArray(level2Tags) && level2Tags.includes(tagName)) {
                        foundLevel2 = level2Key;
                        break;
                    }
                }

                if (foundLevel2) {
                    const sidebar = document.getElementById('sidebar');
                    const groupHeaders = sidebar.querySelectorAll('.menu-level1-header');
                    for (const header of groupHeaders) {
                        if (header.dataset.level1 === level1Key) {
                            const level2Container = header.nextElementSibling;
                            if (level2Container) {
                                level2Container.classList.add('open');
                                header.querySelector('.arrow').classList.add('open');
                            }

                            const level2Headers = level2Container ? level2Container.querySelectorAll('.menu-level2-header') : [];
                            for (const l2Header of level2Headers) {
                                const l2Text = l2Header.textContent.trim();
                                if (l2Text.includes(foundLevel2)) {
                                    const level3Container = l2Header.nextElementSibling;
                                    if (level3Container) {
                                        level3Container.classList.add('open');
                                        l2Header.querySelector('.arrow').classList.add('open');
                                    }

                                    const items = level3Container ? level3Container.querySelectorAll('.menu-level3-item') : [];
                                    for (const item of items) {
                                        if (item.dataset.tag === tagName) {
                                            setTimeout(() => {
                                                item.click();
                                                item.scrollIntoView({ block: 'center', behavior: 'smooth' });
                                            }, 100);
                                            return true;
                                        }
                                    }
                                    if (items.length > 0) {
                                        setTimeout(() => { items[0].click(); }, 100);
                                        return true;
                                    }
                                }
                            }
                        }
                    }
                }
            }
            return false;
        }

        // ============================================================
        // 8. 加载数据
        // ============================================================
        async function loadData() {
            try {
                const response = await fetch('/data/data.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error('数据加载失败');
                const data = await response.json();

                allStocks = data.stocks || [];
                themeMapping = data.theme_mapping || {};

                if (Object.keys(themeMapping).length === 0) {
                    console.warn('data.json 中未找到 theme_mapping');
                    themeMapping = {};
                }

                renderSidebar(themeMapping, allStocks);

                const tagFromURL = getTagFromURL();
                if (tagFromURL) {
                    setTimeout(() => {
                        const success = autoSelectTag(tagFromURL, themeMapping);
                        if (!success) {
                            document.getElementById('pageTitle').textContent = `🔍 未找到主题: ${tagFromURL}`;
                            document.getElementById('stockCount').textContent = '';
                            document.getElementById('stockGridContainer').innerHTML = `
                                <div class="empty-state">
                                    <div class="emoji">🔍</div>
                                    <p>未找到「${tagFromURL}」对应的主题</p>
                                    <p style="font-size: 13px; color: #94a3b8; margin-top: 8px;">请从左侧菜单选择</p>
                                </div>
                            `;
                        }
                    }, 200);
                }

            } catch (error) {
                console.error('加载数据失败:', error);
                document.getElementById('stockGridContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">⚠️</div>
                        <p>数据加载失败，请刷新重试</p>
                    </div>
                `;
            }
        }

        // ============================================================
        // 9. 启动
        // ============================================================
        document.addEventListener('DOMContentLoaded', loadData);
        window.copyToClipboard = copyToClipboard;
    </script>
</body>
</html>
