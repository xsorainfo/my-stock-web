<!-- 在 <script> 最前面引入导航栏组件 -->
<script src="../components/navbar.js"></script>
<!-- ⭐ 引入共通工具函数 -->
<script src="../components/common.js"></script>

<script>
    // ============================================================
    // sub_ai.html 特有逻辑
    // ============================================================
    
    let allStocks = [];
    let themeMapping = {};
    let currentSelected = null;
    let sectorMapping = [];

    // ============================================================
    // 获取一级菜单下的所有 tag
    // ============================================================
    function getAllTagsForLevel1(level1Key, themeMapping) {
        const tags = [];
        const level1Value = themeMapping[level1Key];

        if (!level1Value) return tags;

        if (Array.isArray(level1Value)) {
            return level1Value;
        } else if (typeof level1Value === 'object') {
            for (const subValue of Object.values(level1Value)) {
                if (Array.isArray(subValue)) {
                    tags.push(...subValue);
                }
            }
        }
        return tags;
    }

    // ============================================================
    // 渲染股票卡片
    // ============================================================
    function renderStockCards(stocks, container) {
        let html = '<div class="stock-grid">';
        stocks.forEach(stock => {
            const colorClass = stock.isUp ? 'text-up' : 'text-down';
            const trendClass = stock.trend === '牛市多头' ? 'trend-up-bg' : 'trend-down-bg';
            const formattedFeature = stock.feature.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            // ⭐ 使用 common.js 中的函数获取 industry 的可读名称
            const industryName = getIndustryName(stock.sector, stock.industry);

            html += `
                <div class="stock-card">
                    <div class="stock-header">
                        <div class="stock-title">
                            <a href="${getYahooUrl(stock)}" target="_blank" style="text-decoration: none; color: inherit;">
                                <h3>${getMarketBadge(stock.market_type)} ${stock.name}</h3>
                            </a>
                            <span class="industry-tag">${industryName}</span>
                        </div>
                        <div class="stock-actions">
                            <span class="stock-code" onclick="copyToClipboard('${stock.code}')" title="点击复制代码">
                                ${stock.code}
                            </span>
                            <a href="${getTradingViewUrl(stock)}" target="_blank" class="tv-link" title="在 TradingView 查看走势">
                                📈
                            </a>
                        </div>
                    </div>

                    <div class="stock-feature">${formattedFeature}</div>

                    <div class="tag-container">                            
                        ${stock.tag_themes ? stock.tag_themes.map(t => {
                            if (t.theme_path && t.theme_path.length > 0) {
                                return `<span class="stock-tag theme-tag" title="${t.theme_path.join(' > ')}">${t.theme_path.join(' › ')}</span>`;
                            }
                            return '';
                        }).join('') : ''}
                    </div>

                    <div class="stock-trend-badge ${trendClass}">${stock.trend}</div>

                    <div class="price-row">
                        <div class="stock-price ${colorClass}">${stock.price}</div>
                        <div class="stock-change ${colorClass}">${stock.change}</div>
                    </div>

                    <table class="metrics-table" style="margin-bottom: 6px;">
                        <thead>
                            <tr>
                                <th style="width: 33.33%;">
                                    <a href="#" onclick="openTargetPrice('${stock.code}'); return false;" style="color: #2563eb; text-decoration: none; cursor: pointer; border-bottom: 1px dashed #2563eb;">
                                        PER 估值 📊
                                    </a>
                                </th>
                                <th style="width: 33.33%;">ROE</th>
                                <th style="width: 33.33%;">PBR 溢价</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>${judgeValuation(stock.per, 'PER')}</td>                                                
                                <td>${judgeROE(stock.roe)}</td>
                                <td>${judgeValuation(stock.pbr, 'PBR')}</td>                                            
                            </tr>
                        </tbody>
                    </table>

                    <table class="metrics-table">
                        <thead>
                            <tr>
                                <th style="width: 33.33%;">距1周高</th>
                                <th style="width: 33.33%;">距1月高</th>
                                <th style="width: 33.33%;">距52周高</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr style="font-weight: 600; color: #1e293b; font-size: 12px;">
                                <td>${stock.distWeek || '--'}</td>
                                <td>${stock.distMonth || '--'}</td>
                                <td>${stock.distHigh || '--'}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        });
        html += '</div>';

        container.innerHTML = html;
    }

    // ============================================================
    // 显示股票（按 tag）
    // ============================================================
    function displayStocksByTag(tagName) {
        const container = document.getElementById('stockGridContainer');
        const countEl = document.getElementById('stockCount');

        const matched = allStocks.filter(stock => {
            if (!stock.tag_themes) return false;
            return stock.tag_themes.some(t => t.tag === tagName && t.theme_path && t.theme_path.length > 0);
        });

        countEl.textContent = `共 ${matched.length} 只标的`;

        if (matched.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">🔍</div>
                    <p>该主题下暂无匹配的股票</p>
                </div>
            `;
            return;
        }

        renderStockCards(matched, container);
    }

    // ============================================================
    // 显示股票（按多个 tags）
    // ============================================================
    function displayStocksByTags(tagNames) {
        const container = document.getElementById('stockGridContainer');
        const countEl = document.getElementById('stockCount');

        if (!tagNames || tagNames.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">📭</div>
                    <p>该分类下暂无标的</p>
                </div>
            `;
            countEl.textContent = '共 0 只标的';
            return;
        }

        const matched = allStocks.filter(stock => {
            if (!stock.tag_themes) return false;
            return stock.tag_themes.some(t =>
                tagNames.includes(t.tag) && t.theme_path && t.theme_path.length > 0
            );
        });

        countEl.textContent = `共 ${matched.length} 只标的`;

        if (matched.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="emoji">🔍</div>
                    <p>该分类下暂无匹配的股票</p>
                </div>
            `;
            return;
        }

        renderStockCards(matched, container);
    }

    // ============================================================
    // 渲染左侧菜单
    // ============================================================
    function renderSidebar(themeMapping, stocks) {
        const sidebar = document.getElementById('sidebar');
        sidebar.innerHTML = '';

        // 构建 tag → stocks 索引
        const tagStockMap = {};
        stocks.forEach(stock => {
            if (stock.tag_themes) {
                stock.tag_themes.forEach(t => {
                    if (t.theme_path && t.theme_path.length > 0) {
                        const tag = t.tag;
                        if (!tagStockMap[tag]) tagStockMap[tag] = [];
                        tagStockMap[tag].push(stock);
                    }
                });
            }
        });

        // 遍历 THEME_MAPPING
        for (const [level1Key, level1Value] of Object.entries(themeMapping)) {
            const menuDiv = document.createElement('div');
            menuDiv.className = 'menu-level1';

            // ---- 统计该一级下所有标签的股票总数 ----
            let totalCount = 0;
            const allTags = [];

            if (Array.isArray(level1Value)) {
                level1Value.forEach(tag => {
                    allTags.push(tag);
                    if (tagStockMap[tag]) totalCount += tagStockMap[tag].length;
                });
            } else if (typeof level1Value === 'object') {
                for (const subKey of Object.keys(level1Value)) {
                    if (Array.isArray(level1Value[subKey])) {
                        level1Value[subKey].forEach(tag => {
                            allTags.push(tag);
                            if (tagStockMap[tag]) totalCount += tagStockMap[tag].length;
                        });
                    }
                }
            }

            // ---- 一级菜单头 ----
            const header = document.createElement('div');
            header.className = 'menu-level1-header';
            header.dataset.level1 = level1Key;

            header.innerHTML = `
                <span class="icon">📂</span>
                <span>${level1Key}</span>
                <span class="count">(${totalCount})</span>
                <span class="arrow">▶</span>
            `;

            header.addEventListener('click', function() {
                const container = this.nextElementSibling;
                const isOpen = container.classList.contains('open');
                
                container.classList.toggle('open');
                this.querySelector('.arrow').classList.toggle('open');
                
                if (!isOpen) {
                    const level1Key = this.dataset.level1;
                    const allTags = getAllTagsForLevel1(level1Key, themeMapping);
                    
                    document.querySelectorAll('.menu-level1-header').forEach(el => el.classList.remove('active'));
                    this.classList.add('active');
                    
                    document.querySelectorAll('.menu-level2-item').forEach(el => el.classList.remove('active'));
                    
                    document.getElementById('pageTitle').textContent = `📂 ${level1Key}`;
                    displayStocksByTags(allTags);
                }
            });

            menuDiv.appendChild(header);

            // ---- 二级菜单容器 ----
            const container = document.createElement('div');
            container.className = 'menu-level2-container';

            if (Array.isArray(level1Value)) {
                level1Value.forEach(tag => {
                    const count = tagStockMap[tag] ? tagStockMap[tag].length : 0;
                    const item = createMenuItem(tag, count, level1Key, tag);
                    container.appendChild(item);
                });
            } else if (typeof level1Value === 'object') {
                for (const [subKey, subValue] of Object.entries(level1Value)) {
                    if (Array.isArray(subValue)) {
                        const groupLabel = document.createElement('div');
                        groupLabel.className = 'menu-group-label';
                        groupLabel.textContent = subKey;
                        container.appendChild(groupLabel);

                        subValue.forEach(tag => {
                            const count = tagStockMap[tag] ? tagStockMap[tag].length : 0;
                            const item = createMenuItem(tag, count, level1Key, tag);
                            container.appendChild(item);
                        });
                    }
                }
            }

            menuDiv.appendChild(container);
            sidebar.appendChild(menuDiv);
        }

        // 默认展开第一个一级菜单
        const firstHeader = sidebar.querySelector('.menu-level1-header');
        if (firstHeader) {
            const container = firstHeader.nextElementSibling;
            container.classList.add('open');
            firstHeader.querySelector('.arrow').classList.add('open');
            setTimeout(() => { firstHeader.click(); }, 100);
        }
    }

    // ============================================================
    // 创建二级菜单项
    // ============================================================
    function createMenuItem(tag, count, level1Key, level2Key) {
        const item = document.createElement('div');
        item.className = 'menu-level2-item';
        item.dataset.tag = tag;
        item.dataset.level1 = level1Key;
        item.dataset.level2 = level2Key;

        item.innerHTML = `
            <span>🏷️</span>
            <span>${tag}</span>
            <span class="count">${count}</span>
        `;

        item.addEventListener('click', function() {
            document.querySelectorAll('.menu-level2-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu-level1-header').forEach(el => el.classList.remove('active'));
            this.classList.add('active');

            const tagName = this.dataset.tag;
            const level1 = this.dataset.level1;

            currentSelected = { level1, tag: tagName };

            document.getElementById('pageTitle').textContent = `🏷️ ${level1} › ${tagName}`;
            displayStocksByTag(tagName);
        });

        return item;
    }

    // ============================================================
    // URL 参数处理
    // ============================================================
    function getTagFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get('tag');
    }

    function autoSelectTag(tagName, themeMapping) {
        if (!tagName || !themeMapping) return false;

        for (const [level1Key, level1Value] of Object.entries(themeMapping)) {
            let found = false;

            if (Array.isArray(level1Value)) {
                if (level1Value.includes(tagName)) found = true;
            } else if (typeof level1Value === 'object') {
                for (const subValue of Object.values(level1Value)) {
                    if (Array.isArray(subValue) && subValue.includes(tagName)) {
                        found = true;
                        break;
                    }
                }
            }

            if (found) {
                const sidebar = document.getElementById('sidebar');
                const headers = sidebar.querySelectorAll('.menu-level1-header');
                for (const header of headers) {
                    if (header.dataset.level1 === level1Key) {
                        const container = header.nextElementSibling;
                        if (container) {
                            container.classList.add('open');
                            header.querySelector('.arrow').classList.add('open');
                        }
                        
                        const items = container ? container.querySelectorAll('.menu-level2-item') : [];
                        for (const item of items) {
                            if (item.dataset.tag === tagName) {
                                setTimeout(() => {
                                    item.click();
                                    item.scrollIntoView({ block: 'center', behavior: 'smooth' });
                                }, 100);
                                return true;
                            }
                        }
                        
                        if (items.length > 0) {
                            setTimeout(() => { items[0].click(); }, 100);
                            return true;
                        }
                    }
                }
            }
        }

        return false;
    }

    // ============================================================
    // 加载数据
    // ============================================================
    async function loadData() {
        try {
            // ⭐ 使用 common.js 中的 loadSectorMapping
            sectorMapping = await loadSectorMapping();
            
            const response = await fetch('/data/data.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error('数据加载失败');
            const data = await response.json();

            allStocks = data.stocks || [];
            themeMapping = data.theme_mapping || {};

            if (Object.keys(themeMapping).length === 0) {
                console.warn('data.json 中未找到 theme_mapping，使用默认值');
                themeMapping = {
                    "1. 半导体设备": ["光刻机", "刻蚀设备", "薄膜沉积设备", "量测检测设备"],
                    "2. 半导体材料": {
                        "制造材料": ["硅基材料 (硅片)", "光刻胶及配套", "电子特气", "湿电子化学品", "抛光材料 (CMP)", "靶材", "掩膜版"],
                        "封装及基板": ["封装基板 (ABF/BT)", "引线框架", "芯片粘接材料", "PCB", "铜箔"],
                        "无源及核心功能": ["MLCC"],
                        "第三代半导体": ["碳化硅 (SiC)", "氮化镓 (GaN)"]
                    },
                    "3. 算力芯片": ["GPU", "ASIC", "CPU", "FPGA", "AI SoC"],
                    "4. 高带宽内存": ["HBM", "GDDR6", "SRAM", "内存接口"],
                    "5. 先进封装": ["2.5D封装", "3D封装", "Chiplet", "封装材料"],
                    "6. 网络互联": ["NVLink/NVSwitch", "InfiniBand", "RoCE", "PCIe"],
                    "7. 光通信": ["光模块", "光芯片", "光纤光缆", "硅光子"],
                    "8. 电力・液冷・数据中心": ["电力系统", "液冷设备", "数据中心架构"],
                    "9. 云・模型・应用": ["云服务IaaS", "基础模型", "AI应用", "智能体Agent"]
                };
            }

            renderSidebar(themeMapping, allStocks);

            const tagFromURL = getTagFromURL();
            if (tagFromURL) {
                setTimeout(() => {
                    const success = autoSelectTag(tagFromURL, themeMapping);
                    if (!success) {
                        document.getElementById('pageTitle').textContent = `🔍 未找到主题: ${tagFromURL}`;
                        document.getElementById('stockCount').textContent = '';
                        document.getElementById('stockGridContainer').innerHTML = `
                            <div class="empty-state">
                                <div class="emoji">🔍</div>
                                <p>未找到「${tagFromURL}」对应的主题</p>
                                <p style="font-size: 13px; color: #94a3b8; margin-top: 8px;">请从左侧菜单选择</p>
                            </div>
                        `;
                    }
                }, 200);
            }

        } catch (error) {
            console.error('加载数据失败:', error);
            document.getElementById('stockGridContainer').innerHTML = `
                <div class="empty-state">
                    <div class="emoji">⚠️</div>
                    <p>数据加载失败，请刷新重试</p>
                </div>
            `;
        }
    }

    // ============================================================
    // 启动
    // ============================================================
    document.addEventListener('DOMContentLoaded', loadData);
</script>
