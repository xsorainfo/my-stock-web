<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球AI硬科技决策终端</title>
    <style>
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --up-color: #ef4444; --down-color: #10b981; --border-color: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* 标题层级 */
        .section-title { font-size: 20px; font-weight: 800; margin: 35px 0 15px; padding-left: 12px; border-left: 6px solid #2563eb; color: #0f172a; }
        .sub-title { font-size: 15px; font-weight: 600; margin: 20px 0 12px 12px; color: #475569; display: flex; align-items: center; }
        
        /* 卡片网格 */
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .stock-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        
        .stock-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .stock-feature { font-size: 12px; color: var(--text-muted); background: #f8fafc; padding: 8px; border-radius: 6px; margin: 10px 0; min-height: 48px; }
        .stock-trend-badge { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
        .trend-up-bg { background: #fee2e2; color: #b91c1c; }
        .trend-down-bg { background: #d1fae5; color: #065f46; }

        .price-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
        .stock-price { font-size: 18px; font-weight: 600; }
        .metrics-table { width: 100%; border-collapse: collapse; font-size: 11px; text-align: center; }
        .val-badge { font-size: 10px; padding: 2px 4px; border-radius: 4px; font-weight: bold; }
        .text-up { color: var(--up-color); }
        .text-down { color: var(--down-color); }
    </style>
</head>
<body>

<div class="container">
    <h1>🖥️ 全球 AI 硬科技决策终端</h1>
    <div id="dashboardRoot"></div>
</div>

<script>
    function judgeValuation(val, type) {
        if (!val || val === '--') return '<span class="val-badge" style="background:#f1f5f9;color:#64748b">--</span>';
        const num = parseFloat(val);
        return `<span class="val-badge" style="background:${num>50?'#fee2e2':'#d1fae5'};color:${num>50?'#ef4444':'#10b981'}">${num.toFixed(1)}</span>`;
    }

    async function loadDashboardData() {
        const res = await fetch('data.json?v=' + new Date().getTime());
        const data = await res.json();
        const root = document.getElementById('dashboardRoot');
        
        // 按行业(Industry)和子类(SubCategory)分组
        const grouped = data.stocks.reduce((acc, s) => {
            if (!acc[s.industry]) acc[s.industry] = {};
            if (!acc[s.industry][s.subCategory]) acc[s.industry][s.subCategory] = [];
            acc[s.industry][s.subCategory].push(s);
            return acc;
        }, {});

        root.innerHTML = Object.entries(grouped).map(([ind, subGroups]) => `
            <div class="section-title">${ind}</div>
            ${Object.entries(subGroups).map(([sub, stocks]) => `
                <div class="sub-title">📂 ${sub}</div>
                <div class="stock-grid">
                    ${stocks.map(s => `
                        <div class="stock-card">
                            <div class="stock-header">
                                <h3>${s.name}</h3>
                                <span style="font-size:11px; background:#f1f5f9; padding:2px 6px; border-radius:4px; color:#64748b">${s.code}</span>
                            </div>
                            <div class="stock-feature">${s.feature}</div>
                            <div class="stock-trend-badge ${s.trend === '牛市多头' ? 'trend-up-bg' : 'trend-down-bg'}">${s.trend}</div>
                            <div class="price-row">
                                <div class="stock-price ${s.isUp?'text-up':'text-down'}">${s.price}</div>
                                <div class="${s.isUp?'text-up':'text-down'}">${s.change}</div>
                            </div>
                            <table class="metrics-table">
                                <tr><td>PER: ${judgeValuation(s.per, 'PER')}</td><td>PBR: ${judgeValuation(s.pbr, 'PBR')}</td></tr>
                                <tr style="font-weight:600; color:#1e293b; padding-top:5px;"><td>${s.distWeek}</td><td>${s.distHigh}</td></tr>
                            </table>
                        </div>
                    `).join('')}
                </div>
            `).join('')}
        `).join('');
    }
    loadDashboardData();
</script>
</body>
</html>
