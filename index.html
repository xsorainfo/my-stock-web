<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球AI硬科技决策终端</title>
    <style>
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --up-color: #ef4444; --down-color: #10b981; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px; line-height: 1.5; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* 头部与AI简报 */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .refresh-btn { background-color: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .ai-briefboard { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 28px; }
        .ai-title { font-weight: 600; color: #1e40af; margin-bottom: 8px; }

        /* 卡片网格 */
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .stock-card { background: var(--card-bg); border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; }
        
        /* 指标与估值样式 */
        .stock-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
        .stock-industry { font-size: 11px; color: #2563eb; margin-bottom: 8px; display: block; }
        .stock-price-main { font-size: 24px; font-weight: 700; margin: 10px 0; }
        
        .data-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
        .data-table th { color: #64748b; font-weight: 400; padding: 4px 0; }
        .data-table td { text-align: center; padding: 4px 0; font-weight: 600; }
        
        .val-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
        .tag-normal { background: #f1f5f9; color: #475569; }
        .tag-high { background: #fee2e2; color: #b91c1c; }
        
        .text-up { color: var(--up-color); }
        .text-down { color: var(--down-color); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🖥️ 全球 AI 硬科技决策终端</h1>
        <button class="refresh-btn" id="cloudRefreshBtn">🔄 召唤云端强刷</button>
    </header>

    <div class="ai-briefboard">
        <div class="ai-title">🤖 首席硬科技策略师 · 盘后多头思维复盘</div>
        <div id="aiReport">正在读取策略流...</div>
    </div>

    <div id="stockContainer"></div>
</div>

<script>
// 核心估值判断逻辑：PER > 40 或 PBR > 10 视为高估
function renderValuation(val, isPBR) {
    if (!val || val === '--') return `<span class="val-tag tag-normal">--</span>`;
    const num = parseFloat(val);
    const isHigh = isPBR ? (num > 10) : (num > 40);
    return `<span class="val-tag ${isHigh ? 'tag-high' : 'tag-normal'}">${num} ${isHigh ? '高估' : '合理'}</span>`;
}

async function loadDashboardData() {
    const res = await fetch('data.json?v=' + new Date().getTime());
    const data = await res.json();
    document.getElementById('aiReport').innerText = data.ai_report;

    const container = document.getElementById('stockContainer');
    const groups = data.stocks.reduce((acc, s) => {
        (acc[s.subCategory || s.industry] = acc[s.subCategory || s.industry] || []).push(s);
        return acc;
    }, {});

    container.innerHTML = Object.entries(groups).map(([cat, items]) => `
        <div style="margin: 30px 0 15px; font-weight: 800; font-size: 18px; border-left: 5px solid #2563eb; padding-left: 12px;">${cat}</div>
        <div class="stock-grid">
           ${items.map(s => `
               <div class="stock-card">
                   <div style="display:flex; justify-content:space-between;">
                       <div class="stock-name">${s.name}</div>
                       <div style="font-size:11px; color:#94a3b8; background:#f8fafc; padding:2px 6px; border-radius:4px;">${s.code}</div>
                   </div>
                   <span class="stock-industry">${s.industry}</span>
                   <div style="font-size:12px; color:#64748b; height:2.5em; overflow:hidden;">${s.feature}</div>
                   <div style="font-size:10px; padding:2px 6px; border-radius:4px; display:inline-block; margin:8px 0; background:${s.trend === '牛市多头' ? '#fee2e2' : '#d1fae5'}; color:${s.trend === '牛市多头' ? '#b91c1c' : '#065f46'}; font-weight:600;">${s.trend}</div>
                   
                   <div class="stock-price-main">
                       <span class="${s.isUp ? 'text-up' : 'text-down'}">${s.price}</span>
                       <span style="font-size:14px; font-weight:500;">${s.change}</span>
                   </div>

                   <table class="data-table">
                       <tr><th>PER 估值</th><th>PBR 溢价</th></tr>
                       <tr><td>${renderValuation(s.per, false)}</td><td>${renderValuation(s.pbr, true)}</td></tr>
                       <tr style="height:10px;"></tr>
                       <tr><th>距1周高</th><th>距1月高</th><th>距52周高</th></tr>
                       <tr><td>${s.distWeek}</td><td>${s.distMonth}</td><td>${s.distHigh}</td></tr>
                   </table>
               </div>
           `).join('')}
        </div>
    `).join('');
}

document.getElementById('cloudRefreshBtn').onclick = loadDashboardData;
loadDashboardData();
</script>
</body>
</html>
