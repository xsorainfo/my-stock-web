<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球AI硬科技决策终端</title>
    <style>
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --up-color: #ef4444; --down-color: #10b981; --border-color: #e2e8f0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px; line-height: 1.5; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        h1 { font-size: 24px; font-weight: 700; }
        
        .refresh-btn { background-color: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .refresh-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        
        .ai-briefboard { background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%); border: 1px solid #bfdbfe; border-radius: 12px; padding: 20px; margin-bottom: 28px; }
        .ai-title { font-weight: 600; color: #1e40af; font-size: 15px; margin-bottom: 8px; }
        .ai-content { font-size: 14px; color: #334155; }
        
        .macro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .macro-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px; }
        
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 30px; }
        .stock-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; }
        
        .stock-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .stock-name { font-weight: 700; font-size: 16px; }
        .stock-code { font-size: 12px; color: #94a3b8; background: #f8fafc; padding: 2px 6px; border-radius: 4px; }
        .stock-industry { font-size: 11px; color: #2563eb; margin-bottom: 8px; display: block; }
        .stock-feature { font-size: 12px; color: #64748b; margin-bottom: 12px; height: 3em; overflow: hidden; }
        
        .trend-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 8px; font-weight: 600; }
        .trend-up { background: #fee2e2; color: #b91c1c; }
        .trend-down { background: #d1fae5; color: #065f46; }
        
        .stock-price-main { font-size: 24px; font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
        
        .data-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 5px; }
        .data-table th { color: #64748b; font-weight: 400; padding: 4px 0; text-align: center; }
        .data-table td { text-align: center; padding: 4px 0; font-weight: 600; }
        .val-tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: #f1f5f9; display: inline-block; }
        
        .text-up { color: #ef4444; }
        .text-down { color: #10b981; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🖥️ 全球 AI 硬科技决策终端</h1>
        <button class="refresh-btn" id="cloudRefreshBtn">🔄 召唤云端强刷</button>
    </header>

    <div class="ai-briefboard">
        <div class="ai-title">🤖 首席硬科技策略师 · 盘后多头思维复盘</div>
        <div class="ai-content" id="aiReport">正在读取策略流...</div>
    </div>

    <div class="macro-grid" id="macroGrid"></div>
    <div id="stockContainer"></div>
</div>

<script>
async function loadDashboardData() {
    try {
        const res = await fetch('data.json?v=' + new Date().getTime());
        const data = await res.json();
        document.getElementById('aiReport').innerText = data.ai_report || "同步就绪";

        // 渲染宏观
        document.getElementById('macroGrid').innerHTML = data.macro.map(i => 
            `<div class="macro-card"><div style="font-size:13px; color:#64748b">${i.name}</div><div style="font-size:20px; font-weight:600" class="${i.isUp?'text-up':'text-down'}">${i.price}</div></div>`
        ).join('');

        // 渲染分组股票
        const container = document.getElementById('stockContainer');
        const groups = data.stocks.reduce((acc, s) => {
            const key = s.subCategory || s.industry || "未分类";
            (acc[key] = acc[key] || []).push(s);
            return acc;
        }, {});

        container.innerHTML = Object.entries(groups).map(([cat, items]) => `
            <div style="margin: 30px 0 15px; font-weight: 800; font-size: 18px; color: #1e293b; border-left: 5px solid #2563eb; padding-left: 12px;">${cat}</div>
            <div class="stock-grid">
               ${items.map(s => `
                   <div class="stock-card">
                       <div class="stock-header">
                           <div class="stock-name">${s.name}</div>
                           <div class="stock-code">${s.code}</div>
                       </div>
                       <span class="stock-industry">${s.industry}</span>
                       <div class="stock-feature">${s.feature}</div>
                       <div class="trend-badge ${s.trend === '牛市多头' ? 'trend-up' : 'trend-down'}">${s.trend}</div>
                       
                       <div class="stock-price-main">
                           <span class="${s.isUp?'text-up':'text-down'}">${s.price}</span>
                           <span style="font-size:14px; color:${s.isUp?'var(--up-color)':'var(--down-color)'}">${s.change}</span>
                       </div>

                       <table class="data-table">
                           <tr><th>PER 估值</th><th>PBR 溢价</th></tr>
                           <tr><td><span class="val-tag">${s.per}</span></td><td><span class="val-tag">${s.pbr}</span></td></tr>
                           <tr style="height:10px;"></tr>
                           <tr><th>距1周高</th><th>距1月高</th><th>距52周高</th></tr>
                           <tr><td>${s.distWeek}</td><td>${s.distMonth}</td><td>${s.distHigh}</td></tr>
                       </table>
                   </div>
               `).join('')}
            </div>
        `).join('');
    } catch (e) { console.error("数据加载失败", e); }
}

document.getElementById('cloudRefreshBtn').onclick = function() {
    this.disabled = true;
    loadDashboardData();
    setTimeout(() => this.disabled = false, 60000);
};
loadDashboardData();
</script>
</body>
</html>
