<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球AI硬科技决策终端 R1</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --up-color: #ef4444; 
            --down-color: #10b981; 
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px; line-height: 1.5; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color); }
        header h1 { font-size: 24px; font-weight: 700; color: #0f172a; }
        .refresh-btn { background-color: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 500; transition: background 0.2s; }
        .refresh-btn:hover:not(:disabled) { background-color: #1d4ed8; }
        .refresh-btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .ai-briefboard { background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%); border: 1px solid #bfdbfe; border-radius: 12px; padding: 20px; margin-bottom: 28px; }
        .ai-title { font-weight: 600; color: #1e40af; font-size: 15px; margin-bottom: 8px; }
        .ai-content { font-size: 14px; color: #334155; }
        .macro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .macro-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px; }
        .macro-name { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        .macro-price { font-size: 22px; font-weight: 700; }
        .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; padding-left: 8px; border-left: 4px solid #2563eb; }
        
        /* 一级分组标题样式 - sector */
        .sector-section { margin-bottom: 40px; }
        .sector-title { 
            font-size: 20px; 
            font-weight: 700; 
            color: #0f172a; 
            margin-bottom: 16px; 
            padding: 10px 16px; 
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border-radius: 8px;
            border-left: 4px solid #2563eb;
            color: #ffffff;
        }
        
        /* 二级分组标题样式 - industry */
        .industry-section { margin-bottom: 28px; margin-left: 16px; }
        .industry-title { 
            font-size: 16px; 
            color: #1e293b; 
            margin-bottom: 14px; 
            padding-left: 12px; 
            border-left: 3px solid #64748b;
            font-weight: 600;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 4px;
        }
        
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .stock-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .stock-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .stock-title h3 { font-size: 16px; font-weight: 700; }
        .stock-industry { font-size: 11px; color: #2563eb; background: #eff6ff; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; }
        .stock-code {
            font-size: 11px;
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            background: #334155;           /* 初始：深蓝灰色 */
            color: #f8fafc;                /* 白色文字 */
            padding: 3px 8px;              /* 稍微加大一点内边距 */
            border-radius: 4px;
            letter-spacing: 0.5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            
            /* 增加过渡效果 */
            transition: all 0.25s ease-in-out;
            cursor: pointer;               /* 鼠标移入显示可点击手势 */
            user-select: none;             /* 防止文字被选中，看起来更像 UI 按钮 */
        }
        
        /* 悬停反馈效果 */
        .stock-code:hover {
            background: #0f172a;           /* 悬停：变为更深邃的黑蓝色 */
            transform: translateY(-1px);   /* 悬停：轻微上浮，增加物理感 */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); /* 悬停：增加阴影深度 */
            color: #38bdf8;                /* 悬停：文字变为亮蓝色，点亮科技感 */
        }
        /* 当用户按下鼠标时，代码块有一个缩小的动画 */
        .stock-code:active {
            transform: scale(0.95);
            background: #1e293b; /* 点击瞬间加深颜色 */
        }
        .stock-feature { 
            font-size: 12px; 
            color: #64748b; 
            background: #f8fafc; 
            padding: 8px; 
            border-radius: 6px; 
            margin-bottom: 14px; 
            min-height: 52px; 
        }
        
        /* 关键：给加粗文字定义高亮色 */
        .stock-feature strong {
            color: #1e293b;      /* 深灰色，比普通文字更深 */
            font-weight: 700;    /* 加粗 */
        }
        
        .stock-trend-badge { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 12px; }
        .trend-up-bg { background: #fee2e2; color: #b91c1c; }
        .trend-down-bg { background: #d1fae5; color: #065f46; }
        .price-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
        .stock-price { font-size: 26px; font-weight: 600; }
        .text-up { color: var(--up-color); }
        .text-down { color: var(--down-color); }
        .val-badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; display: inline-block; margin-top: 2px; }
        .val-high { background: #fee2e2; color: #ef4444; }
        .val-low { background: #d1fae5; color: #10b981; }
        .val-normal { background: #f1f5f9; color: #64748b; }
        .metrics-table { width: 100%; border-collapse: collapse; font-size: 11px; color: #64748b; text-align: center; }
        .metrics-table th { font-weight: normal; padding: 4px 2px; background: #f8fafc; color: #64748b; }
        .metrics-table td { padding: 6px 2px 4px 2px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🖥️ 全球 AI 硬科技决策终端</h1>
        <button class="refresh-btn" id="cloudRefreshBtn">🔄 召唤云端强刷</button>
    </header>

    <div class="ai-briefboard">
        <div class="ai-title">🤖 首席硬科技策略师 · 盘后多头思维复盘</div>
        <div class="ai-content" id="aiReport">正在读取策略官核心简报流...</div>
    </div>

    <div class="macro-grid" id="macroGrid"></div>

    <h2 class="section-title">AI 半导体与全要素核心标的集群</h2>
    <div id="industryContainer"></div>
</div>

<script>
    function judgeValuation(val, type) {
        if (!val || val === '--' || isNaN(parseFloat(val))) return '<span class="val-badge val-normal">--</span>';
        const num = parseFloat(val);
        if (type === 'PER'|| type === 'forward_per') {
            if (num > 50) return `<span class="val-badge val-high">${num.toFixed(1)} 高估值</span>`;
            if (num < 25) return `<span class="val-badge val-low">${num.toFixed(1)} 具性价比</span>`;
            return `<span class="val-badge val-normal">${num.toFixed(1)} 合理</span>`;
        } else if (type === 'PBR') {
            if (num > 15) return `<span class="val-badge val-high">${num.toFixed(1)} 高溢价</span>`;
            if (num < 3) return `<span class="val-badge val-low">${num.toFixed(1)} 净资产防守</span>`;
            return `<span class="val-badge val-normal">${num.toFixed(1)} 正常</span>`;
        }
        return `<span class="val-badge val-normal">${num}</span>`;
    }

    // 辅助函数：根据市场类型返回对应的 HTML 标签
    function getMarketBadge(type) {
        const map = {
            '美股': '<span class="badge us">🇺🇸</span>',
            '日股': '<span class="badge jp">🇯🇵</span>',
            'A股':  '<span class="badge cn">🇨🇳</span>'
        };
        return map[type] || '';
    }

    async function loadDashboardData() {
        try {
            const response = await fetch('data.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error('数据加载失败');
            const data = await response.json();

            document.getElementById('aiReport').innerText = data.ai_report || '💡 数据就绪。';

            // 宏观数据渲染保持不变
            const macroGrid = document.getElementById('macroGrid');
            macroGrid.innerHTML = '';
            data.macro?.forEach(item => {
                const colorClass = item.isUp ? 'text-up' : 'text-down';
                macroGrid.innerHTML += `
                    <div class="macro-card">
                        <div class="macro-name">${item.name}</div>
                        <div class="macro-price ${colorClass}">${item.price}</div>
                        <div class="macro-change ${colorClass}">${item.change}</div>
                    </div>`;
            });

            // 两层分组：先按 sector（一级），再按 industry（二级）
            const container = document.getElementById('industryContainer');
            container.innerHTML = '';
            
            // 按 sector 分组
            const sectorGroups = data.stocks.reduce((acc, stock) => {
                const sectorKey = stock.sector || '未分类板块';
                if (!acc[sectorKey]) acc[sectorKey] = [];
                acc[sectorKey].push(stock);
                return acc;
            }, {});

            // 遍历每个 sector
            for (const [sector, sectorStocks] of Object.entries(sectorGroups)) {
                const sectorDiv = document.createElement('div');
                sectorDiv.className = 'sector-section';
                sectorDiv.innerHTML = `<h2 class="sector-title">${sector}</h2>`;
                
                // 在 sector 内部按 industry 分组
                const industryGroups = sectorStocks.reduce((acc, stock) => {
                    const industryKey = stock.industry || '其他';
                    if (!acc[industryKey]) acc[industryKey] = [];
                    acc[industryKey].push(stock);
                    return acc;
                }, {});

                // 遍历每个 industry
                for (const [industry, industryStocks] of Object.entries(industryGroups)) {
                    const industryDiv = document.createElement('div');
                    industryDiv.className = 'industry-section';
                    industryDiv.innerHTML = `<h3 class="industry-title">${industry}</h3>`;
                    
                    const grid = document.createElement('div');
                    grid.className = 'stock-grid';
                    
                    industryStocks.forEach(stock => {
                        // 预处理 feature，支持 **加粗**
                        const formattedFeature = stock.feature.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                        const colorClass = stock.isUp ? 'text-up' : 'text-down';
                        const trendClass = stock.trend === '牛市多头' ? 'trend-up-bg' : 'trend-down-bg';
                        grid.innerHTML += `
                            <div class="stock-card">
                                <div class="stock-header">
                                    <div class="stock-title">
                                        <a href="https://finance.yahoo.com/quote/${stock.code}" target="_blank" style="text-decoration: none; color: inherit;">
                                            <h3>${getMarketBadge(stock.market_type)} ${stock.name}</h3>
                                        </a>
                                       
                                    </div>
                                    <span class="stock-code" onclick="copyToClipboard('${stock.code}')">
                                        ${stock.code}
                                    </span>
                                </div>
                                <div class="stock-feature">${formattedFeature}</div>
                                <div class="stock-trend-badge ${trendClass}">${stock.trend}</div>
                                <div class="price-row">
                                    <div class="stock-price ${colorClass}">${stock.price}</div>
                                    <div class="stock-change ${colorClass}">${stock.change}</div>
                                </div>
                                
                                <table class="metrics-table" style="margin-bottom: 6px;">
                                    <thead>
                                        <tr>
                                            <th style="width: 33%;">PER 估值</th>
                                            <th style="width: 34%;">预想 PER</th>
                                            <th style="width: 33%;">PBR 溢价</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>${judgeValuation(stock.per, 'PER')}</td>
                                            <td>${judgeValuation(stock.forward_per, 'forward_per')}</td>
                                            <td>${judgeValuation(stock.pbr, 'PBR')}</td>
                                        </tr>
                                    </tbody>
                                </table>

                                <table class="metrics-table">
                                    <thead>
                                        <tr>
                                            <th style="width: 33.33%;">距1周高</th>
                                            <th style="width: 33.33%;">距1月高</th>
                                            <th style="width: 33.33%;">距52周高</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr style="font-weight: 600; color: #1e293b; font-size: 12px;">
                                            <td>${stock.distWeek || '--'}</td>
                                            <td>${stock.distMonth || '--'}</td>
                                            <td>${stock.distHigh || '--'}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>`;
                    });
                    
                    industryDiv.appendChild(grid);
                    sectorDiv.appendChild(industryDiv);
                }
                
                container.appendChild(sectorDiv);
            }
        } catch (error) { console.error(error); }
    }
    
    // 点击股票代码复制
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            // 可选：添加一个简单的提示效果
            console.log('已复制: ' + text);
            
            // 可选：给用户一个视觉反馈 (比如弹出小气泡)
            //alert('代码 ' + text + ' 已复制到剪贴板！');
        }).catch(err => {
            console.error('复制失败: ', err);
        });
    }
    document.getElementById('cloudRefreshBtn').addEventListener('click', async function() {
        const btn = this;
        if (btn.disabled) return;
        btn.disabled = true;
        btn.innerText = "正在发送指令...";
        try {
            const res = await fetch('/api/refresh', { method: 'POST' });
            if (res.ok) {
                let s = 45;
                btn.innerText = `🔄 等待 ${s}s 后刷新...`;
                const t = setInterval(() => {
                    s--;
                    if (s > 0) btn.innerText = `🔄 等待 ${s}s 后刷新...`;
                    else { clearInterval(t); window.location.reload(); }
                }, 1000);
            } else { btn.disabled = false; btn.innerText = '🔄 召唤云端强刷'; alert("失败"); }
        } catch (e) { btn.disabled = false; btn.innerText = '🔄 召唤云端强刷'; alert("错误"); }
    });

    window.onload = loadDashboardData;
</script>
</body>
</html>
