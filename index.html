<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球AI硬科技决策终端</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --up-color: #ef4444; 
            --down-color: #10b981; 
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 24px;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
        }

        .refresh-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .refresh-btn:hover {
            background-color: #1d4ed8;
        }

        .ai-briefboard {
            background: linear-gradient(135deg, #eff6ff 0%, #f8fafc 100%);
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 28px;
        }

        .ai-title {
            font-weight: 600;
            color: #1e40af;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .ai-content {
            font-size: 14px;
            color: #334155;
        }

        .macro-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .macro-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
        }

        .macro-name {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .macro-price {
            font-size: 22px;
            font-weight: 700;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            padding-left: 8px;
            border-left: 4px solid #2563eb;
        }

        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .stock-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .stock-title h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .stock-industry {
            font-size: 11px;
            color: #2563eb;
            background: #eff6ff;
            padding: 2px 6px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }

        .stock-code {
            font-size: 11px;
            background: #f1f5f9;
            color: #64748b;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .stock-feature {
            font-size: 12px;
            color: var(--text-muted);
            background: #f8fafc;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 14px;
            min-height: 52px;
        }

        .stock-trend-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .trend-up-bg { background: #fee2e2; color: #b91c1c; }
        .trend-down-bg { background: #d1fae5; color: #065f46; }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 12px;
        }

        .stock-price {
            font-size: 26px;
            font-weight: 800;
        }

        .text-up { color: var(--up-color); }
        .text-down { color: var(--down-color); }
        
        /* 估值判断专用标签样式 */
        .val-badge {
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: bold;
            display: block;
            margin-top: 2px;
        }
        .val-high { background: #fee2e2; color: #ef4444; }
        .val-low { background: #d1fae5; color: #10b981; }
        .val-normal { background: #f1f5f9; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🖥️ 全球 AI 硬科技决策终端</h1>
        <button class="refresh-btn" id="cloudRefreshBtn">🔄 召唤云端强刷</button>
    </header>

    <div class="ai-briefboard">
        <div class="ai-title">🤖 首席硬科技策略师 · 盘后多头思维复盘</div>
        <div class="ai-content" id="aiReport">正在读取策略官核心简报流...</div>
    </div>

    <div class="macro-grid" id="macroGrid"></div>

    <h2 class="section-title">AI 半导体与全要素核心标的集群</h2>
    <div class="stock-grid" id="stockGrid"></div>
</div>

<script>
    // 💡 修复：多级估值智能动态判定函数
    function judgeValuation(val, type) {
        if (!val || val === '--' || isNaN(parseFloat(val))) return '<span class="val-badge val-normal">--</span>';
        const num = parseFloat(val);
        
        if (type === 'PER') {
            if (num > 50) return `<span class="val-badge val-high">${num.toFixed(1)} 高估值</span>`;
            if (num < 25) return `<span class="val-badge val-low">${num.toFixed(1)} 具性价比</span>`;
            return `<span class="val-badge val-normal">${num.toFixed(1)} 合理</span>`;
        } else if (type === 'PBR') {
            if (num > 15) return `<span class="val-badge val-high">${num.toFixed(1)} 高溢价</span>`;
            if (num < 3) return `<span class="val-badge val-low">${num.toFixed(1)} 净资产防守</span>`;
            return `<span class="val-badge val-normal">${num.toFixed(1)} 正常</span>`;
        }
        return `<span class="val-badge val-normal">${num}</span>`;
    }

    async function loadDashboardData() {
        try {
            const response = await fetch('data.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error('未能正确加载终端决策流数据');
            const data = await response.json();

            document.getElementById('aiReport').innerText = data.ai_report || '💡 终端同步就绪。全生态多头防御格局整体维持，保持结构性跟踪。';

            const macroGrid = document.getElementById('macroGrid');
            macroGrid.innerHTML = '';
            if (data.macro && data.macro.length > 0) {
                data.macro.forEach(item => {
                    const colorClass = item.isUp ? 'text-up' : 'text-down';
                    macroGrid.innerHTML += `
                        <div class="macro-card">
                            <div class="macro-name">${item.name}</div>
                            <div class="macro-price ${colorClass}">${item.price}</div>
                            <div class="macro-change ${colorClass}">${item.change}</div>
                        </div>
                    `;
                });
            }

            const stockGrid = document.getElementById('stockGrid');
            stockGrid.innerHTML = '';
            if (data.stocks && data.stocks.length > 0) {
                data.stocks.forEach(stock => {
                    const colorClass = stock.isUp ? 'text-up' : 'text-down';
                    const trendClass = stock.trend === '牛市多头' ? 'trend-up-bg' : 'trend-down-bg';
                    
                    // 调用估值判定核心逻辑
                    const perHtml = judgeValuation(stock.per, 'PER');
                    const pbrHtml = judgeValuation(stock.pbr, 'PBR');

                    stockGrid.innerHTML += `
                        <div class="stock-card">
                            <div class="stock-header">
                                <div class="stock-title">
                                    <h3>${stock.name}</h3>
                                    <div class="stock-industry">${stock.industry}</div>
                                </div>
                                <span class="stock-code">${stock.code}</span>
                            </div>
                            
                            <div class="stock-feature">${stock.feature}</div>
                            
                            <div class="stock-trend-badge ${trendClass}">${stock.trend}</div>
                            
                            <div class="price-row">
                                <div class="stock-price ${colorClass}">${stock.price}</div>
                                <div class="stock-change ${colorClass}">${stock.change}</div>
                            </div>
                            
                            <table style="
                                width: 100%; 
                                margin-top: 12px; 
                                padding-top: 8px; 
                                border-top: 1px dashed #e2e8f0; 
                                border-collapse: collapse;
                                font-size: 11px;
                                color: #64748b;
                            ">
                                <thead>
                                    <tr style="text-align: center; background: #f8fafc;">
                                        <th style="font-weight: 500; padding: 4px 2px; width: 20%;">PER估值</th>
                                        <th style="font-weight: 500; padding: 4px 2px; width: 20%;">PBR溢价</th>
                                        <th style="font-weight: 400; padding: 4px 2px; width: 20%;">距1周高</th>
                                        <th style="font-weight: 400; padding: 4px 2px; width: 20%;">距1月高</th>
                                        <th style="font-weight: 400; padding: 4px 2px; width: 20%;">距52周高</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr style="text-align: center; color: #1e293b; font-size: 11px; vertical-align: top;">
                                        <td style="padding-top: 6px;">${perHtml}</td>
                                        <td style="padding-top: 6px;">${pbrHtml}</td>
                                        <td style="padding-top: 8px; font-weight: 600; font-size: 12px;">${stock.distWeek || '--'}</td>
                                        <td style="padding-top: 8px; font-weight: 600; font-size: 12px;">${stock.distMonth || '--'}</td>
                                        <td style="padding-top: 8px; font-weight: 600; font-size: 12px;">${stock.distHigh || '--'}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                });
            }
        } catch (error) {
            console.error('渲染故障:', error);
        }
    }

    // 💡 修复：右上角强刷按钮终极绑定防御
    document.getElementById('cloudRefreshBtn').addEventListener('click', function() {
        // 1. 先刷本地界面
        loadDashboardData();
        // 2. 如果你原本有特定的外部刷新逻辑或 Actions 触发代码，请加在这里：
        console.log("云端强刷信号已发出...");
        alert("🔄 正在从云端数据源重新对齐交易时区，请稍候查看编译状态！");
    });

    window.onload = loadDashboardData;
</script>

</body>
</html>
