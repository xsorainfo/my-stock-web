<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的大盘研究看板</title>
  <style>
    body { 
      background-color: #f5f7fa; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
      padding: 30px; 
      margin: 0; 
    }

    /* 整个网页的主容器，限制最大宽度 */
    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 行业区块的样式 */
    .industry-section {
      margin-bottom: 40px;
    }

    /* 行业大标题 */
    .industry-title {
      font-size: 22px;
      font-weight: bold;
      color: #2d3748;
      margin-bottom: 16px;
      padding-left: 10px;
      border-left: 5px solid #3182ce; /* 蓝色的行业小竖条 */
    }

    /* 核心：卡片网格系统 */
    .stock-grid {
      display: grid;
      /* 核心魔法：自动填满，每个卡片最小 260px。如果屏幕够宽，一行自动排 4-5 个；屏幕窄（如手机）自动变 1 个 */
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px; /* 卡片之间的间距 */
    }

    /* 股票卡片美化（稍微缩小了一点点体积，方便横向排更多） */
    .stock-card { 
      background: #ffffff; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.04); 
      padding: 18px; 
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }
    /* 鼠标悬停在卡片上时有一个微微浮起的效果 */
    .stock-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    .card-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      margin-bottom: 8px; 
    }
    .stock-code { font-size: 12px; background: #edf2f7; padding: 2px 6px; border-radius: 4px; color: #4a5568; font-weight: bold; }
    .stock-name { font-size: 16px; font-weight: 600; color: #1a202c; }
    
    .feature-box { 
      font-size: 11px; 
      color: #718096; 
      background: #f7fafc; 
      padding: 6px 10px; 
      border-radius: 6px; 
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .price-section { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
    .current-price { font-size: 28px; font-weight: bold; color: #2d3748; }
    .divider { border: none; border-top: 1px solid #edf2f7; margin: 10px 0; }
    .metrics-grid { display: flex; justify-content: space-between; }
    .metric-item { display: flex; flex-direction: column; }
    .label { font-size: 11px; color: #a0aec0; margin-bottom: 2px; }
    .value { font-size: 13px; font-weight: 600; color: #2d3748; }
    .loading { text-align: center; color: #a0aec0; margin-top: 50px; }
  </style>
</head>
<body>

  <div class="dashboard-container" id="dashboard">
    <div class="loading">正在归类并加载自选股看板...</div>
  </div>

  <script>
    async function loadStockData() {
      try {
        const response = await fetch('./data.json');
        const stocks = await response.json();
        
        const dashboard = document.getElementById("dashboard");
        dashboard.innerHTML = ""; 
        
        // 1. 提取所有不重复的行业名称
        const industries = [...new Set(stocks.map(s => s.industry))];
        // 核心排序：按照我们在 Python 里定好的序号（1, 2, 3）进行严格升序排列
        industries.sort();
        
        // 2. 先把有序的行业大盒子画好
        industries.forEach(ind => {
          // 显示时把前面的“1. ”数字切掉，保持视觉干净优雅
          const displayName = ind.substring(3); 
          let sectionHtml = `
            <div class="industry-section">
              <div class="industry-title">${displayName}</div>
              <div class="stock-grid" id="grid-${ind.replace(/\./g, '')}"></div>
            </div>
          `;
          dashboard.innerHTML += sectionHtml;
        });
    
        // 3. 把股票卡片精准塞进各自的行业网格
        stocks.forEach(stock => {
          // 匹配无点的 ID
          const gridId = `grid-${stock.industry.replace(/\./g, '')}`;
          const grid = document.getElementById(gridId);
          const changeColor = stock.isUp ? "#e53e3e" : "#00b060"; 
          
          const cardHtml = `
            <div class="stock-card">
              <div>
                <div class="card-header">
                  <span class="stock-name">${stock.name}</span>
                  <span class="stock-code">${stock.code}</span>
                </div>
                <div class="feature-box">${stock.feature}</div>
              </div>
              <div>
                <div class="price-section">
                  <div class="current-price">${stock.price}</div>
                  <div style="color: ${changeColor}; font-weight: 500; font-size: 14px;">${stock.change}</div>
                </div>
                <hr class="divider">
                <div class="metrics-grid">
                  <div class="metric-item"><span class="label">PER</span><span class="value">${stock.per}</span></div>
                  <div class="metric-item"><span class="label">PBR</span><span class="value">${stock.pbr}</span></div>
                </div>
              </div>
            </div>
          `;
          if(grid) grid.innerHTML += cardHtml;
        });
    
      } catch (error) {
        document.getElementById("dashboard").innerHTML = "数据加载失败，请检查数据流。";
        console.error(error);
      }
    }

    loadStockData();
  </script>
</body>
</html>
