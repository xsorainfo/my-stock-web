<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球AI硬科技决策终端</title>
    <style>
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --up-color: #ef4444; --down-color: #10b981; --border-color: #e2e8f0; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px; font-family: -apple-system, sans-serif; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .stock-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        
        /* 还原卡片元数据样式 */
        .stock-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .stock-industry { font-size: 11px; color: #2563eb; background: #eff6ff; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 4px; }
        .stock-feature { font-size: 12px; color: var(--text-muted); background: #f8fafc; padding: 8px; border-radius: 6px; margin: 10px 0; min-height: 48px; }
        .stock-trend-badge { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-bottom: 8px; }
        .trend-up-bg { background: #fee2e2; color: #b91c1c; }
        .trend-down-bg { background: #d1fae5; color: #065f46; }

        /* 价格与表格 */
        .price-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
        .stock-price { font-size: 18px; font-weight: 600; }
        .metrics-table { width: 100%; border-collapse: collapse; font-size: 11px; color: #64748b; text-align: center; }
        .val-badge { font-size: 10px; padding: 2px 4px; border-radius: 4px; font-weight: bold; }
        
        .text-up { color: var(--up-color); }
        .text-down { color: var(--down-color); }
    </style>
</head>
<body>
<div class="container">
    <h1>🖥️ 全球 AI 硬科技决策终端</h1>
    <div id="stockGrid" class="stock-grid"></div>
</div>

<script>
    function judgeValuation(val, type) {
        if (!val || val === '--') return '<span class="val-badge" style="background:#f1f5f9">--</span>';
        const num = parseFloat(val);
        return `<span class="val-badge" style="background:${num>50?'#fee2e2':'#d1fae5'}">${num}</span>`;
    }

    async function loadDashboardData() {
        const res = await fetch('data.json?v=' + new Date().getTime());
        const data = await res.json();
        const sGrid = document.getElementById('stockGrid');
        
        // 还原分组与所有 UI 元素
        const groups = data.stocks.reduce((acc, s) => { (acc[s.category] = acc[s.category] || []).push(s); return acc; }, {});
        
        sGrid.innerHTML = Object.entries(groups).map(([cat, items]) => `
            <div style="grid-column: 1/-1; margin: 20px 0 10px; font-weight: 700; color: #475569; border-left: 4px solid #2563eb; padding-left: 10px;">${cat}</div>
            ${items.map(s => `
                <div class="stock-card">
                    <div class="stock-header">
                        <div><h3>${s.name}</h3><div class="stock-industry">${s.industry}</div></div>
                        <span style="font-size:11px; background:#f1f5f9; padding:2px 6px; border-radius:4px;">${s.code}</span>
                    </div>
                    <div class="stock-feature">${s.feature}</div>
                    <div class="stock-trend-badge ${s.trend === '牛市多头' ? 'trend-up-bg' : 'trend-down-bg'}">${s.trend}</div>
                    <div class="price-row">
                        <div class="stock-price ${s.isUp?'text-up':'text-down'}">${s.price}</div>
                        <div class="${s.isUp?'text-up':'text-down'}">${s.change}</div>
                    </div>
                    <table class="metrics-table">
                        <tr><td>PER: ${judgeValuation(s.per, 'PER')}</td><td>PBR: ${judgeValuation(s.pbr, 'PBR')}</td></tr>
                        <tr style="font-weight:600; color:#1e293b;"><td>${s.distWeek}</td><td>${s.distHigh}</td></tr>
                    </table>
                </div>
            `).join('')}
        `).join('');
    }
    loadDashboardData();
</script>
</body>
</html>
