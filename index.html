<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的大盘研究看板</title>
  <style>
    body { background-color: #f5f7fa; font-family: -apple-system, sans-serif; padding: 30px; margin: 0; }
    .dashboard-container { max-width: 1400px; margin: 0 auto; }
    
    /* 顶部导航栏，用来放按钮 */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .page-title { font-size: 24px; font-weight: bold; color: #1a202c; margin: 0; }
    
    /* 强刷按钮样式 */
    .refresh-btn {
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .refresh-btn:hover { background-color: #2b6cb0; }
    .refresh-btn:disabled { background-color: #cbd5e0; cursor: not-allowed; }

    .industry-section { margin-bottom: 40px; }
    .industry-title { font-size: 22px; font-weight: bold; color: #2d3748; margin-bottom: 16px; padding-left: 10px; border-left: 5px solid #3182ce; }
    .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
    .stock-card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); padding: 18px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
    .stock-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .stock-code { font-size: 12px; background: #edf2f7; padding: 2px 6px; border-radius: 4px; color: #4a5568; font-weight: bold; }
    .stock-name { font-size: 16px; font-weight: 600; color: #1a202c; }
    .feature-box { font-size: 11px; color: #718096; background: #f7fafc; padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; line-height: 1.4; }
    .price-section { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
    .current-price { font-size: 28px; font-weight: bold; color: #2d3748; }
    .divider { border: none; border-top: 1px solid #edf2f7; margin: 10px 0; }
    .metrics-grid { display: flex; justify-content: space-between; }
    .metric-item { display: flex; flex-direction: column; }
    .label { font-size: 11px; color: #a0aec0; margin-bottom: 2px; }
    .value { font-size: 13px; font-weight: 600; color: #2d3748; }
    .loading { text-align: center; color: #a0aec0; margin-top: 50px; }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <!-- 顶部状态栏 -->
    <div class="header-bar">
      <h1 class="page-title">硬科技与半导体深度看板</h1>
      <button class="refresh-btn" id="refresh-btn" onclick="triggerCloudRobot()">
        <span>🔄 召唤云端强刷</span>
      </button>
    </div>

    <!-- 看板主大厅 -->
    <div id="dashboard">
      <div class="loading">正在归类并加载自选股看板...</div>
    </div>
  </div>

  <script>
    // 【配置区】请把下面的信息换成你自己的
    const GITHUB_USER = "你的GitHub用户名"; 
    const GITHUB_REPO = "my-stock-web";
    // 把刚才复制的 ghp_ 开头的通行证贴在下面
    const GITHUB_TOKEN = "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"; 

    async function loadStockData() {
      try {

        const response = await fetch('./data.json?t=' + new Date().getTime());
        
        const stocks = await response.json();
        
        const dashboard = document.getElementById("dashboard");
        dashboard.innerHTML = ""; 
        
        const industries = [...new Set(stocks.map(s => s.industry))].sort();
        
        industries.forEach(ind => {
          const displayName = ind.substring(3); 
          let sectionHtml = `
            <div class="industry-section">
              <div class="industry-title">${displayName}</div>
              <div class="stock-grid" id="grid-${ind.replace(/\./g, '')}"></div>
            </div>
          `;
          dashboard.innerHTML += sectionHtml;
        });

        stocks.forEach(stock => {
          const gridId = `grid-${stock.industry.replace(/\./g, '')}`;
          const grid = document.getElementById(gridId);
          const changeColor = stock.isUp ? "#e53e3e" : "#00b060"; 
          
          const cardHtml = `
            <div class="stock-card">
              <div>
                <div class="card-header">
                  <span class="stock-name">${stock.name}</span>
                  <span class="stock-code">${stock.code}</span>
                </div>
                <div class="feature-box">${stock.feature}</div>
              </div>
              <div>
                <div class="price-section">
                  <div class="current-price">${stock.price}</div>
                  <div style="color: ${changeColor}; font-weight: 500; font-size: 14px;">${stock.change}</div>
                </div>
                <hr class="divider">
                <div class="metrics-grid">
                  <div class="metric-item"><span class="label">PER</span><span class="value">${stock.per}</span></div>
                  <div class="metric-item"><span class="label">PBR</span><span class="value">${stock.pbr}</span></div>
                </div>
              </div>
            </div>
          `;
          if(grid) grid.innerHTML += cardHtml;
        });
      } catch (error) {
        document.getElementById("dashboard").innerHTML = "数据加载失败，请检查数据流。";
      }
    }

    // 核心功能：点击按钮远程惊醒 GitHub 机器人
    // 升级版：安全的远程惊醒机器人功能
    async function triggerCloudRobot() {
      const btn = document.getElementById("refresh-btn");
      btn.disabled = true;
      btn.innerHTML = "⚡ 机器人正在赶往交易所(约40秒)...";
    
      try {
        // 网页不再直接联系 GitHub，而是直接呼叫我们自己的 Vercel 后端安全接口
        const response = await fetch('/api/refresh', {
          method: "POST"
        });
    
        if (response.ok) {
          // 发送成功，进入 40 秒倒计时
          let seconds = 40;
          const timer = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
              clearInterval(timer);
              window.location.reload(); 
            } else {
              btn.innerHTML = `⏳ 请等待 ${seconds} 秒后查看结果...`;
            }
          }, 1000);
        } else {
          const resData = await response.json();
          alert("召唤失败：" + (resData.error || "未知后端错误"));
          btn.disabled = false;
          btn.innerHTML = "🔄 召唤云端强刷";
        }
      } catch (e) {
        alert("网络错误：" + e);
        btn.disabled = false;
        btn.innerHTML = "🔄 召唤云端强刷";
      }
    }

    loadStockData();
  </script>
</body>
</html>
