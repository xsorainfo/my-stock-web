<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>全球AI硬科技决策终端</title>
    <style>
        :root { --bg-color: #f4f6f9; --text-main: #1e293b; }
        body { background-color: var(--bg-color); font-family: -apple-system, sans-serif; padding: 24px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* 强制确保按钮样式与行为 */
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .refresh-btn { background: #2563eb; color: #fff; padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
        .refresh-btn:disabled { background: #94a3b8; }

        /* 紧凑卡片容器 */
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .stock-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; }
        
        /* 核心表格对齐 */
        .data-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 12px; }
        .data-table th { color: #64748b; font-weight: 400; padding-bottom: 4px; }
        .data-table td { text-align: center; padding: 4px 0; font-weight: 600; }
        .val-tag { display: inline-block; padding: 2px 6px; border-radius: 4px; }
        .tag-high { background: #fee2e2; color: #b91c1c; }
        .tag-normal { background: #f1f5f9; color: #475569; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1>🖥️ 全球 AI 硬科技决策终端</h1>
        <button id="cloudRefreshBtn" class="refresh-btn">🔄 召唤云端强刷</button>
    </div>
    <div id="aiReport" style="padding:15px; background:#fff; border-radius:8px; margin-bottom:20px;">正在载入...</div>
    <div id="stockContainer"></div>
</div>

<script>
// 1. 防御性判断逻辑：确保即便数据缺失也不会报错
function renderVal(val, isPBR) {
    if (val === undefined || val === null || val === '--') return `<span class="val-tag tag-normal">--</span>`;
    const num = parseFloat(val);
    const isHigh = isPBR ? (num > 10) : (num > 40);
    return `<span class="val-tag ${isHigh ? 'tag-high' : 'tag-normal'}">${num} ${isHigh ? '高估' : '合理'}</span>`;
}

// 2. 核心加载函数
async function loadData() {
    const btn = document.getElementById('cloudRefreshBtn');
    btn.disabled = true;
    btn.innerText = "刷新中...";
    
    try {
        // 强制避开缓存
        const response = await fetch('data.json?t=' + new Date().getTime());
        const data = await response.json();
        
        // 渲染逻辑
        document.getElementById('aiReport').innerText = data.ai_report || "暂无简报";
        const container = document.getElementById('stockContainer');
        
        // 分组处理
        const groups = data.stocks.reduce((acc, s) => {
            const cat = s.subCategory || s.industry || "未分类";
            (acc[cat] = acc[cat] || []).push(s);
            return acc;
        }, {});

        container.innerHTML = Object.entries(groups).map(([cat, items]) => `
            <h3 style="margin:20px 0 10px">${cat}</h3>
            <div class="stock-grid">
                ${items.map(s => `
                    <div class="stock-card">
                        <div style="font-weight:700;">${s.name} <span style="color:#94a3b8; font-size:11px;">${s.code}</span></div>
                        <div style="font-size:20px; font-weight:700; margin:8px 0;" class="${s.isUp?'text-up':'text-down'}">${s.price}</div>
                        <table class="data-table">
                            <tr><th>PER</th><th>PBR</th></tr>
                            <tr><td>${renderVal(s.per, false)}</td><td>${renderVal(s.pbr, true)}</td></tr>
                            <tr><th style="padding-top:10px;">1周回撤</th><th style="padding-top:10px;">52周回撤</th></tr>
                            <tr><td>${s.distWeek || '--'}</td><td>${s.distHigh || '--'}</td></tr>
                        </table>
                    </div>
                `).join('')}
            </div>
        `).join('');
    } catch (e) {
        alert("数据加载出错，请检查 data.json 格式");
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.innerText = "🔄 召唤云端强刷";
    }
}

// 3. 稳健绑定
document.getElementById('cloudRefreshBtn').addEventListener('click', loadData);
loadData();
</script>
</body>
</html>
