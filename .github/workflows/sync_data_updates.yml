name: Sync latest data to data-updates

on:
  push:
    branches: [main]
    paths:
      - "data/data.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data-updates
        uses: actions/checkout@v4
        with:
          ref: data-updates
          fetch-depth: 0
      - name: Fetch main data
        run: git fetch origin main --depth=1
      - name: Copy main data
        run: git show origin/main:data/data.json > data/data.json
      - name: Commit data-updates
        run: |
          if git diff --quiet -- data/data.json; then
            echo "data/data.json already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git commit -m "同步最新股票数据 [skip ci]"
          git push origin HEAD:data-updates
