name: Validate taxonomy

on:
  push:
    paths:
      - "config.py"
      - "data/*catalog.json"
      - "data/taxonomy_schema.json"
      - "scripts/taxonomy_utils.py"
      - "scripts/validate_taxonomy.py"
  pull_request:
    paths:
      - "config.py"
      - "data/*catalog.json"
      - "data/taxonomy_schema.json"
      - "scripts/taxonomy_utils.py"
      - "scripts/validate_taxonomy.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate taxonomy
        run: python scripts/validate_taxonomy.py
