name: 自动更新股票数据

on:
  repository_dispatch:
    types: [web_refresh] # 这一行非常重要
  workflow_dispatch:
  
  schedule:
    # 早盘：东京时间UTC+9 09:00 - 11:30（UTC 00:00 - 02:30）每15分钟
    - cron: '0,15,30,45 0,1,2 * * 1-5'
    # 午盘：东京时间 12:30 - 15:30（UTC 03:30 - 06:30）每15分钟
    - cron: '0,15,30,45 3,4,5,6 * * 1-5'
    # 收盘后：东京时间 16:00（UTC 07:00）再跑一次
    - cron: '0 7 * * 1-5'

# 🌟【超级核心加固】：彻底解决 git push 报 exit code 1 的权限拉闸问题
permissions:
  contents: write

# 🌟【体验加固】：强制开启官方推荐的 Node.js 24 容器，彻底抹除讨厌的黄色警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    # 升级到高版本 checkout，配合 permissions 顺畅读写
    - name: 检查代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # yfinance 如果要请求大盘和 AI，通常也需要 requests 库作为底层依赖
    - name: 安装 yfinance 及网络依赖包
      run: |
        pip install --upgrade pip
        pip install yfinance requests

      
    # 🛠️【终极修复】：在这里把通道正式打通，将 GitHub 后台的 Secret 送进 Python
    - name: 运行 Python 脚本抓取数据
      env:
        AI_API_KEY: ${{ secrets.AI_API_KEY }}
      run: python scripts/update_data.py

    - name: 把最新数据提交回 GitHub 仓库
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # ⭐ 先拉取远程最新代码（自动合并）
        git pull origin $(git branch --show-current) --no-rebase
        
        git add data/data.json
        
        # 调试：查看是否有改动需要提交
        if git diff --cached --quiet; then
          echo "没有数据变化，跳过提交"
        else
          git commit -m "自动更新股票数据 [skip ci]"
          # 增加 -v 参数可以看到 push 时的详细交互，有助于分析权限错误
          # git push -v origin main
          # 自动获取当前分支名，防止以后分支名变更
          git push -v origin HEAD:$(git branch --show-current)
        fi

  
