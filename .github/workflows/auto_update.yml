name: Batch更新股票数据

on:
  repository_dispatch:
    types: [web_refresh]
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: write

concurrency:
  group: stock-data-publish
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 读取 main 最新代码和配置
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 准备独立的数据分支目录
        uses: actions/checkout@v4
        with:
          ref: data-updates
          path: published-data

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装 yfinance 及网络依赖包
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance requests

      - name: 运行 main 的 Python 脚本抓取数据
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          echo "代码与配置来源: main"
          git log -1 --format='%h %s'
          python scripts/update_data.py

      - name: 检查生成文件并复制到数据分支
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source = Path("data/data.json")
          with source.open(encoding="utf-8") as handle:
              data = json.load(handle)
          if not isinstance(data.get("stocks"), list) or not data["stocks"]:
              raise SystemExit("股票数据为空，停止发布")
          if not data.get("generated_at"):
              raise SystemExit("缺少 generated_at，停止发布")
          print("generated_at:", data["generated_at"])
          print("stocks:", len(data["stocks"]))
          destination = Path("published-data/data/data.json")
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, destination)
          print("发布目标: data-updates/data/data.json")
          PY

      - name: 仅向 data-updates 提交行情
        working-directory: published-data
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "data-updates"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -- data/data.json
          if git diff --cached --quiet; then
            echo "没有数据变化，跳过提交"
            exit 0
          fi
          git commit -m "自动更新股票数据 [skip ci]"
          # 禁止 force push；并发修改时保留远程历史。
          for attempt in 1 2 3; do
            git fetch origin data-updates
            git rebase origin/data-updates
            if git push origin HEAD:refs/heads/data-updates; then
              echo "已发布 data-updates；main 未写入行情"
              exit 0
            fi
          done
          echo "数据分支推送失败"
          exit 1
