name: １．自动更新股票卡片数据

on:
  # 1. 设定定时任务：
  # 规则：周一到周五，世界时间的 0点、1点、2点、3点、6点、7点、8点 自动运行
  # 换算成北京时间刚好是：上午 9:00、10:00、11:00（早盘），以及下午 14:00、15:00、16:00（午盘和收盘）
  schedule:
    - cron: '0 1,2,3,6,7,8,9 * * 1-5'
  
  # 2. 核心：允许网页通过 API 远程呼叫它
  repository_dispatch:
    types: [web_refresh]
    
  # 3. 同时也保留网页上手动点击运行
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
    - name: 检查代码
      uses: actions/checkout@v3

    - name: 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安装 yfinance 依赖包
      run: pip install yfinance

    - name: 运行 Python 脚本抓取数据
      run: python update_data.py

    - name: 把最新数据提交回 GitHub 仓库
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data.json
        git commit -m "自动更新股票数据 [skip ci]" || exit 0
        git push
